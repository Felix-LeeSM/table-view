# Local-only OpenTelemetry collector for agent-navigation measurement.
#
# Nothing leaves the machine: the only exporter writes to the console. ADR 0036
# (telemetry zero-collection) governs what the product ships; this is a
# developer-side instrument for answering "does the agent find the rule?", run
# by hand and never wired into the app or CI.
#
# Run:
#   otelcol-contrib --config scripts/otel/collector-local.yaml
# Then, in the shell that launches the agent:
#   export CLAUDE_CODE_ENABLE_TELEMETRY=1
#   export OTEL_METRICS_EXPORTER=otlp
#   export OTEL_LOGS_EXPORTER=otlp
#   export OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
#   export OTEL_LOG_TOOL_DETAILS=1      # tool_parameters on claude_code.tool_result
#
# `OTEL_EXPORTER_OTLP_ENDPOINT` is also what switches on this repo's own counter
# (`scripts/hooks/apply/otel-emit.sh`); unset, that emitter is inert.
#
# What to look for:
#   claude_code.tool_decision   — accept/reject per tool, and the source
#   claude_code.tool_result     — success, duration_ms, tool_result_size_bytes
#   routing.rule.delivered      — this repo's counter: a surface's rules were
#                                 injected. Compare against Read decisions on
#                                 the memory/ paths that were injected — the gap
#                                 between the two IS the wander signal.
#
# Deliberately NOT exported anywhere else. Adding a network exporter here makes
# it a product telemetry decision and needs an ADR.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 5s

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
