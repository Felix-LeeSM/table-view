name: review-gate

# label 기반 merge gate — 계정이 하나라 GitHub review approval 을 쓸 수 없어
# `review:approved` label 로 우회한다. branch protection 의 required check.
# 프로토콜 source: memory/workflow/review/memory.md, memory/workflow/delivery/memory.md

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  pull-requests: write
  # 라운드 집계가 PR 의 커밋(oid + committedDate)을 읽는다. `permissions:` 블록을
  # 쓰면 여기 없는 scope 는 none 이므로 읽는 것을 적어 둔다.
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 새 commit 이 push 되면 기존 verdict 는 양쪽 다 무효 — stale approval 로 미리뷰
      # 코드가 머지되는 것을 막고 (dismiss stale approvals 대응), 대칭으로 stale
      # changes-requested 도 떨군다. 지적을 고친 commit 이 올라와도 red verdict label 이
      # 남아 있으면 다음 라운드가 이미 해소된 finding 을 근거로 시작한다.
      #
      # **이 스텝이 synchronize 의 첫 스텝이어야 한다.** 뒤 스텝의 `if:` 는 암묵
      # `success()` 라, 앞에 실패할 수 있는 스텝을 두면 그 실패가 이 스텝을 skip 시켜
      # 유일한 stale-approval 가드가 통째로 사라진다 (PR #2081 라운드 2 가 잡은 결함).
      - name: Dismiss stale approval on new commits
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/review%3Aapproved" || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/review%3Achanges-requested" || true
          echo "::error::new commits pushed — review:approved / review:changes-requested dismissed, re-review required"
          exit 1

      # 새 head OID = 새 라운드다 (#1968). `reflect:done` 은 그 라운드에 대한 사용자
      # 진행 승인이라 다음 라운드로 넘기지 않는다 — 안 떼면 한 번 붙은 label 이
      # 라운드 4·5·6 을 영구 skip 시킨다. 위 "Dismiss stale approval" 이 같은
      # synchronize 에서 verdict label 을 떼는 것과 같은 패턴이다.
      #
      # **그 dismissal 뒤에 오고 `always()` 로 돈다.** dismissal 은 의도적으로 exit 1
      # 하므로 `always()` 없이 뒤에 두면 영영 안 돈다. 앞에 두는 것도 안 된다 — 이
      # 스텝의 exit 1 이 dismissal 을 skip 시켜 stale approval 이 살아남는다. 앞에
      # 두고 `continue-on-error` 로 막는 형태는 쓰지 않는다: 해제 실패가 실패로 안
      # 잡히니 dismissal 의 exit 1 이 나중에 사라지면 label 잔존이 아무 신호 없이
      # 통과한다. `always()` 라 run 이 cancel 될 때도 해제를 시도한다 —
      # `cancel-in-progress` 가 synchronize run 을 자주 죽이는데 `!cancelled()` 로
      # 바꾸면 그 경우 label 이 남는다. 이 배치(순서 + `always()`)는
      # scripts/review/measure-rounds.test.sh 의 "reflect:done 해제" 절이 본다.
      #
      # 해제 실패는 통과가 아니라 실패다. label 이 남은 채로 넘어가면 다음 라운드가
      # 사용자 승인 없이 게이트를 통과한다 — DELETE 뒤에 실제로 사라졌는지 재조회로
      # 확인하고, 확인 자체가 안 되면(API 실패) 판정 불가로 보고 exit 1 한다.
      - name: Release reflect:done on a new round
        if: always() && github.event_name == 'pull_request' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # 안 붙어 있으면 404 라 실패가 정상이다 — 판정은 아래 재조회가 한다.
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels/reflect%3Adone" >/dev/null 2>&1 || true
          labels="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" --jq '.[].name')" || {
            echo "::error::reflect:done 해제를 확인하지 못했다 (label 조회 실패) — 남아 있으면 다음 라운드가 사용자 승인 없이 통과한다"
            exit 1
          }
          # 잔존 판정을 파이프 status 에서 뗀다 (#2330). 옛 형태
          # `printf '%s\n' "$labels" | grep -qxF 'reflect:done'` 는 grep -q 가 첫
          # 일치에서 stdin 을 안 비우고 빠지는 동안 왼쪽 printf 가 아직 쓸 것을 갖고
          # 있으면 EPIPE 를 맞고, `pipefail` 이 그 비영 status 를 파이프라인 status 로
          # 올려 판정을 뒤집는다 — 부호가 「없어야 한다」라 label 이 남아 있는데
          # 「해제됐다」로 통과하는 조용한 거짓 green 이다. 이 스텝은 `shell:` 이 없어
          # `bash -e {0}` 로 돌고 pipefail 이 없지만, 같은 저장소의 e2e-smoke.yml ·
          # platform-smoke-canary.yml · release.yml 이 이미 `shell: bash` 를 쓴다 —
          # 그 형태가 이 파일에 오는 날 뒤집힌다. 221212 자 payload 로 잰 값
          # (첫 줄이 reflect:done, bash 3.2.57): 옛 형태는 `bash -e -c` 에서
          # rc=1(탐지) · `bash -e -o pipefail -c` 에서 rc=0(놓침)이고, 아래 case
          # 형태는 양쪽 다 rc=1 이다.
          #
          # `case` 는 파이프를 안 만들어 그 status 가 성립할 자리 자체가 없다. 양끝
          # 개행이 부분 일치를 막아 `grep -qxF` 의 줄 단위 일치와 뜻이 같고, 인용된
          # 확장은 glob 이 아니라 리터럴이다 — scripts/check-ci-test-calls.sh 의
          # has() 와 같은 형태다. 회귀 가드는 scripts/review/measure-rounds.test.sh 의
          # 「assertion helpers (#2330)」 절이다.
          nl=$'\n'
          case "$nl$labels$nl" in
          *"${nl}reflect:done${nl}"*)
            echo "::error::reflect:done 해제 실패 — label 이 그대로 남아 있다. 손으로 떼라: gh pr edit ${PR} --remove-label reflect:done"
            exit 1
            ;;
          esac
          echo "::notice::reflect:done released — 새 head OID 는 새 라운드다"

      # 라운드 = 서로 다른 head 커밋에 붙은 리뷰 인계의 수 (#1968). 옛 프록시는 PR
      # 코멘트 수였는데 이 저장소는 계정이 하나라 리뷰어 scorecard 와 구현자 응답 ·
      # 세션 공지를 API 로 못 가른다 — #1968 실측에서 코멘트 168건 중 최소 27건이
      # 라운드가 아니었고 8개 PR 에서 카운터가 실제 라운드를 앞질렀다.
      #
      # 웹훅 payload 에는 head OID 별 집계가 없다. 그래서 `if:` 가 읽을 값을 이
      # 스텝이 GraphQL 로 만들어 output 으로 넘긴다.
      #
      # 세는 것은 scripts/review/measure-rounds.sh 의 `round_events("head-oid")` 와
      # 같다 — 코멘트 시각 이하의 마지막 커밋을 그 코멘트의 head 로 보고, 서로 다른
      # head 의 수를 센다. 두 구현이 어긋나는지는
      # scripts/review/measure-rounds.test.sh 의 "gate coupling" 단계가 본다.
      # 근사의 한계는 그 스크립트 하단 「못 재는 것」이 SOT 이고 여기에도 그대로
      # 걸린다: ① `committedDate` 는 push 시각이 아니라 rebase / 옛 커밋 지연 push 는
      # 코멘트를 실제와 다른 커밋에 붙인다 ② 코멘트 · 커밋이 100건을 넘으면 페이지가
      # 잘려 라운드가 낮게 나온다 ③ 누가 쓴 코멘트인지는 여전히 모른다 — 같은 커밋에
      # 달린 응답을 접을 뿐 없애지는 못한다.
      #
      # 집계 실패는 통과가 아니라 실패다. 조용히 0 으로 강등되면 라운드 게이트가
      # 열린 채로 남는다.
      - name: Count review rounds by head OID
        id: rounds
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          rounds="$(gh api graphql \
            -F owner="${GITHUB_REPOSITORY%%/*}" \
            -F name="${GITHUB_REPOSITORY##*/}" \
            -F pr="${PR}" \
            -f query='
              query($owner:String!, $name:String!, $pr:Int!) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$pr) {
                    comments(first:100) { nodes { createdAt } }
                    commits(last:100) { nodes { commit { oid committedDate } } }
                  }
                }
              }' | jq '
            .data.repository.pullRequest
            | (.comments.nodes | map(.createdAt) | sort) as $ts
            | (.commits.nodes | map(.commit) | sort_by(.committedDate)) as $cs
            | [ $ts[]
                | . as $t
                | (([ $cs[] | select(.committedDate <= $t) ] | last | .oid) // "before-first-commit") ]
            | unique | length')"
          case "$rounds" in
          '' | *[!0-9]*)
            echo "::error::head OID 라운드 집계 실패 — 게이트를 통과로 강등하지 않는다"
            exit 1
            ;;
          esac
          echo "rounds=$rounds" >>"$GITHUB_OUTPUT"
          echo "::notice::review rounds (distinct head OIDs) = $rounds"

      # 3라운드부터는 red 면 fix 를 더 쌓지 말고 근본 원인을 재평가한다 (delivery
      # 「자율 실행 vs 중단」). green 이면 재평가 대상이 아니라 종결자가 label 붙이고 머지한다.
      # 임계값 3 은 완화 대상이 아니라 지켜야 할 선이다 — 걸리면 라운드를 줄여라.
      # `reflect:done` 은 라운드 단위 탈출구다 — 위 "Release reflect:done on a new round"
      # 가 새 head OID 마다 떼므로 다음 라운드는 승인을 다시 받아야 한다 (#1968).
      - name: Stop at review round 3
        if: >-
          github.event_name == 'pull_request'
          && steps.rounds.outputs.rounds >= 3
          && !contains(github.event.pull_request.labels.*.name, 'reflect:done')
        run: |
          echo "::error::rounds=${{ steps.rounds.outputs.rounds }} (서로 다른 head 커밋에 붙은 리뷰 인계 수) — 리뷰 3라운드. green 이면 reflect:done 을 붙이고 머지해라 (게이트는 라운드만 세고 verdict 는 안 본다). red 면 같은 유형에 fix 를 더 쌓지 말고 재발 유형 / 라운드별 건수 / 시도한 것을 사용자에게 올려라 — 진행 승인이 reflect:done 이다. 그 승인은 이 라운드에만 유효하다: 새 커밋이 오면 자동으로 떨어진다."
          exit 1

      # scorecard 한 장의 분량 cap (#2321). scorecard 는 다음 라운드 구현자가
      # 읽는 입력인데 한 장이 memory 방 하나의 cap 을 넘게 자라 있었다. 판정과
      # 상한 12,000 의 출처는 scripts/check-review-size-cap.sh 헤더이고, 실측
      # 분포는 issue #2321 과 그 PR body 가 재현 명령과 함께 갖는다.
      #
      # **여기가 집행 자리인 이유**: scorecard 는 PR body 가 아니라 코멘트라
      # ci.yml 이 못 본다 — 그 workflow 는 `labeled` 를 안 듣는다. 이 workflow 는
      # 듣는다. 리뷰어가 verdict label 을 붙이는 순간 방금 올라온 scorecard 를 잰다.
      #
      # **자리 — `Stop at review round 3` 뒤, `Require review:approved` 앞.**
      # 앞에 두면 이 스텝의 red 가 뒤 스텝의 암묵 `success()` 를 깨서 라운드 정지
      # 신호를 통째로 가린다. 뒤로 더 내리면 `review:approved` 는 열린 PR 의 상시
      # 상태라 changes-requested 라운드의 scorecard 가 영영 안 재진다 — 정작 분량이
      # 폭주하는 것은 그쪽 라운드다.
      #
      # **Checkout 이 맨 앞이 아닌 이유도 같다.** 첫 스텝(stale approval
      # dismissal)의 주석이 「앞에 실패할 수 있는 스텝을 두지 마라」로 못박았고,
      # checkout 은 실패할 수 있다 — 맨 앞에 두면 그 실패가 유일한 stale-approval
      # 가드를 skip 시킨다. 여기서 실패하면 `Require review:approved` 가 skip 되지만
      # 게이트는 red 라 머지는 그대로 막힌다 (fail-closed).
      #
      # **그래서 아래 `Checkout` 과 `Scorecard size cap` 은 `always()` 로 돈다 (#2372).**
      # 자리를 지키는 것만으로는 부족하다 — 바로 앞 `Stop at review round 3` 이
      # 의도적으로 exit 1 하므로 암묵 `success()` 가 「rounds >= 3 이고
      # `reflect:done` 이 없는」 구간에서 이 검사를 통째로 skip 시켰다. 그러면 재는
      # 자리가 `reflect:done` 이 붙은 뒤로 좁혀지는데, 하필 그 구간의 scorecard 가
      # 가장 길고(그 라운드부터 유형 재발 표를 더 싣는다) 거기서 red 가 나면 남의
      # scorecard 를 줄일 자격이 있는 노드가 없다.
      # 위 `Release reflect:done on a new round` 가 같은 함정을 같은 방식으로 피한다.
      #
      # 대가: `Checkout` 이 실패해도 cap 스텝이 돌아 오류가 겹친다. 그 겹침을
      # `steps.<id>.outcome` 으로 막지 않는다 — 이 검사의 실행을 남의 스텝 결과에
      # 묶으면 그 스텝이 skip 되는 날 검사도 같이 조용히 사라져 지금 고치는 결함이
      # 그대로 돌아온다. 겹친 오류는 시끄럽고 사라진 검사는 조용하다.
      #
      # 다만 겹친 오류가 **틀린 원인을 지목하면** 시끄러운 것이 이득이 아니다 —
      # checkout 이 실패하면 cap 스텝의 스크립트가 없어 bash 가 rc=127 을 내고, 그
      # 스텝의 `|| over=$((over + 1))` 이 그것을 「분량 초과」로 세어 남의 scorecard 를
      # 줄이라고 지시했다. 그래서 그 스텝이 세기 전에 산출물 존재를 먼저 본다
      # (아래 `Scorecard size cap` 의 `test -f`). 이것도 스텝 결과가 아니라 산출물을
      # 보므로 위 원칙을 안 깬다.
      #
      # `Require review:approved` 는 안 고친다. 그 스텝은 red 만 더하는데 앞이 red 면
      # 게이트는 이미 막혀 있어 skip 이 아무것도 안 놓친다. 형태의 회귀 가드는
      # scripts/__tests__/check-review-size-cap.test.ts 의
      # "runs review-gate's … even after `Stop at review round 3` exits 1" 케이스다.
      - name: Checkout
        if: always() && github.event_name == 'pull_request'
        uses: actions/checkout@v6

      # 코멘트는 payload 가 아니라 API 로 읽는다 — ci.yml 의 PR body cap 과 정반대로,
      # 코멘트를 고치고 이 job 을 re-run 하면 red 가 풀린다 (re-run 은 payload 를
      # 재생하지만 이 스텝의 입력은 payload 가 아니다).
      #
      # 고르는 기준은 `## Scorecard` 로 시작하는 코멘트다 — issue #2321 이 분포를
      # 잰 선택자와 같고, 형식의 SOT 는 .agents/prompts/pr-review.md 「반환 형식」이다.
      # 그 제목으로 안 여는 코멘트는 이 게이트 밖이다.
      #
      # 조회 실패는 통과가 아니라 실패다. 0 장은 통과다 — opened / synchronize 처럼
      # 아직 리뷰가 안 붙은 이벤트에서도 이 job 이 돌기 때문이고, 그때 "scorecard 가
      # 없다" 는 못 잰 것이 아니라 참이다.
      #
      # 아래 `printf '%s'` 에 `\n` 이 없다. 개행도 한 글자라 문자 cap 이 그것을 센다 —
      # `'%s\n'` 이면 호출자가 문서에 없던 한 글자를 얹어 상한의 뜻이 자리마다 달라진다
      # (ci.yml 의 같은 자리가 5516 자 body 를 5517 로 읽었다). 이쪽은 `$( )` 가 끝
      # 개행을 떼고 `printf` 가 하나를 도로 붙여 상쇄됐지만, 상쇄는 코멘트가 개행 하나로
      # 끝날 때만 성립한다. 여기서 재는 것은 **끝 개행을 뗀 코멘트**다 — 늘 실제 이하라
      # 거짓 red 를 못 만든다.
      - name: Scorecard size cap
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          # 위 `always()` 의 대가를 여기서 받는다 — `Checkout` 이 실패해도 이 스텝은
          # 돌고, 아래가 부르는 스크립트는 그 checkout 이 놓는 파일이다. 없으면 bash 가
          # rc=127 을 내는데 `|| over=$((over + 1))` 은 비영 rc 를 전부 「상한 초과」로
          # 세므로, 아무것도 안 쟀는데 "scorecard 를 줄인 뒤 re-run 해라" 가 찍힌다.
          # 스텝 결과가 아니라 **산출물**을 보는 이유는 위 `Checkout` 앞 주석의
          # 「`steps.<id>.outcome` 으로 막지 않는다」와 같다.
          test -f scripts/check-review-size-cap.sh || {
            echo "::error::scripts/check-review-size-cap.sh 이 없다 — 분량 cap 검사 불성립이다 (위 Checkout 이 실패했거나 skip 됐다). 통과로 강등하지 않는다. scorecard 를 줄이는 것은 이 red 의 처방이 아니다 — 먼저 Checkout 을 고쳐라"
            exit 1
          }
          if ! ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.body | startswith("## Scorecard")) | .id')"; then
            echo "::error::scorecard 코멘트 목록을 못 읽었다 — 검사 불성립. 분량 cap 을 통과로 강등하지 않는다"
            exit 1
          fi
          checked=0
          over=0
          for id in $ids; do
            if ! body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" --jq .body)"; then
              echo "::error::scorecard ${id} 를 못 읽었다 — 검사 불성립"
              exit 1
            fi
            checked=$((checked + 1))
            printf '%s' "$body" | bash scripts/check-review-size-cap.sh "scorecard ${id}" || over=$((over + 1))
          done
          if [ "$over" -gt 0 ]; then
            echo "::error::분량 cap 을 넘은 scorecard ${over} 장 (위 FAIL 줄의 코멘트 id). 그 코멘트를 줄인 뒤 이 job 을 re-run 해라 — 이 스텝은 코멘트를 API 로 다시 읽으므로 새 commit 없이 풀린다."
            exit 1
          fi
          echo "::notice::scorecard ${checked} 장 검사 — 분량 cap 초과 0 장"

      - name: Require review:approved label
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'review:approved')
        run: |
          echo "::error::review:approved label missing — green review verdict required before merge"
          exit 1

      # main 에 올라온 merge commit — PR head SHA 에서 이미 gate 를 통과했으므로
      # required check 미보고로 인한 pending 고착만 해소하면 된다.
      - name: Gate pass
        run: echo "gate pass"
