name: CI

# Trigger policy:
# - `push` on `main` only: validates what actually landed (post-merge gate).
# - `pull_request`: validates feature branches before they merge.
# This avoids the duplicate run that fires when an open PR's branch is
# pushed (push + pull_request would each schedule a separate workflow on
# the same SHA).
#
# No `edited`, even though `pr-body` below now reads the PR body: adding it
# would re-run the six required checks this workflow reports (~20 min) on every
# body edit. Six, not seven — the seventh required context, `Runtime Happy
# Path`, lives in e2e-smoke.yml, which does not listen for `edited` either. The
# cost of leaving it off is that a red `PR Body Contract` clears only on the
# next commit — a job re-run replays the original event payload, so it
# re-reads the OLD body and fails again. Fix the body, then push.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

# Cancel policy differs by event (audit 2026-07-03):
# - pull_request: cancel in-flight runs when a newer commit arrives — the old
#   run is stale the moment a new commit lands, and fast feedback wins.
# - push to main: do NOT cancel. Let the running post-merge run finish; GitHub
#   keeps at most one running + one pending per group and replaces the pending
#   one, so a burst of N merges converges to first-run + last-run = 2 runs.
#   Cancelling on main could leave zero main runs ever completing during a merge
#   wave, which (a) forfeits the rust-cache main save (only main writes the
#   shared cache) and (b) opens a post-merge verification gap — the background
#   condition behind the 3-week-frozen partial e2e cache. Cost: the tip-of-main
#   signal lags by up to one run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # `PR Body Contract` is a required context in the `pr_to_main` ruleset (live
  # GitHub state); a name that stops reporting stays "expected" and blocks every
  # merge, so the `name:` is load-bearing — do not rename it. Drop the ruleset
  # entry before deleting this job. No job is change-gated — everything below
  # runs on every event.
  pr-body:
    name: PR Body Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The PR body is the evidence a reviewer reads on github.com, so a path
      # that only resolves on the author's machine is evidence nobody else can
      # open. SOT for the rule: memory/workflow/delivery/memory.md 「PR body」.
      #
      # The body arrives through `env:`, never interpolated into the script: a
      # PR body is attacker-controlled text, and `${{ ... }}` inside `run:` is
      # substituted before bash parses the line, so a body containing `$(...)`
      # or a backtick would execute here.
      - name: Reject non-portable paths in PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$BODY" ]; then
            echo "no PR body on this event — nothing to check"
            exit 0
          fi
          if printf '%s\n' "$BODY" | grep -n -F \
            -e '/Users/' -e '/tmp/' -e 'file://' -e 'worktrees/' -e 'clones/'; then
            echo "::error::PR body carries a non-portable path (matching lines above, numbered from the top of the body). Use repo-relative paths and URLs that open on github.com. SOT: memory/workflow/delivery/memory.md 「PR body」. This check re-runs on the next commit, not on a body edit."
            exit 1
          fi
          echo "PR body clean — no non-portable path patterns."

      # A second, unrelated contract rides in this job: CLAUDE.md's
      # `@AGENTS.md` line. That one line is what loads the agent rules into
      # every harness and every spawned subagent — rewritten as a markdown link
      # it stopped being delivered (#1865). Nothing has ever checked the line
      # itself: the doc-link checker #2033 deleted collected inline, reference
      # and href/src links only, with no branch for a line-leading `@path`
      # (`git show 6cced3ab^:scripts/check-doc-links.ts`), and `git log --all
      # -S '@AGENTS.md' -- scripts .github` finds no other checker. What that
      # one did cover is CLAUDE.md's separate `[AGENTS.md](AGENTS.md)` link —
      # the `test -f` half below, never the import. It lives here because this
      # is the cheapest job with no change gate, so the guard runs on every PR
      # and every push to main; the job `name:` is a required context, so it
      # cannot be renamed to match. Checkout is needed only by this step — the
      # PR body step above reads its input from the event payload. A red here
      # is diagnosed from memory/runbook/pr-merge-gates/memory.md.
      - name: Checkout
        uses: actions/checkout@v6

      # `-x` pins the whole line and `-F` keeps the `.` literal, so the import
      # must survive verbatim; `test -f` covers the other half, an import
      # pointing at a file nobody kept.
      - name: CLAUDE.md import intact
        run: grep -qxF '@AGENTS.md' CLAUDE.md && test -f AGENTS.md

      # A third contract rides here for the same reason the second one does
      # (#2128). AGENTS.md 「강제 룰」 caps every `memory/**/memory.md` at 200
      # lines and 12,000 CHARACTERS, and until now nothing measured it. It lands
      # in this job rather than a job of its own because a required context is
      # registered in the `pr_to_main` ruleset — live GitHub state this PR
      # cannot change — and a freshly registered context that has never
      # reported pins every open PR at BLOCKED
      # (memory/runbook/pr-merge-gates/memory.md). Riding a context that is
      # already required makes the cap blocking the day this merges. The script
      # needs no toolchain, so it adds no setup to the cheapest job: 0.17s over
      # 40 files, median of 9 local runs of
      # `/usr/bin/time -p bash scripts/check-memory-doc-size.sh` (the shell
      # builtin `time` prints no `real` line under zsh, so the command is
      # spelled with the binary).
      - name: memory/ doc size cap
        run: bash scripts/check-memory-doc-size.sh

      # A fourth contract rides here, for the same reason the second and third
      # do (#2113). `--test` is an allowlist: an integration binary under
      # src-tauri/tests that no workflow line names never runs, so a test
      # written to turn CI red can sit green and gate nothing — the `keyring_*`
      # binaries did exactly that until #1815. Which binaries count as uncalled
      # is decided by `scripts/check-ci-test-calls.sh` alone; its header states
      # the rule and running it prints the current tally. Every uncalled binary
      # has to carry a reason in `ci-uncalled-tests.txt`, and one that does not
      # fails here. Draining that file — wiring each binary in or deleting it —
      # is a follow-up issue, not this one (owner's call, 2026-08-03).
      # It lands in this job rather than one of its own because a required
      # context is registered in the `pr_to_main` ruleset, live GitHub state a
      # PR cannot change, and a freshly registered context that has never
      # reported pins every open PR at BLOCKED
      # (memory/runbook/pr-merge-gates/memory.md). Riding an already-required
      # context makes the comparison blocking the day this merges. The script
      # needs no toolchain: 0.18s, median of 9 local runs of
      # `/usr/bin/time -p bash scripts/check-ci-test-calls.sh` on macOS against
      # this branch's tree (the shell builtin `time` prints no `real` line under
      # zsh, so the command is spelled with the binary). No runner measurement
      # exists until this merges.
      - name: src-tauri test binaries called or allowlisted
        run: bash scripts/check-ci-test-calls.sh

      # A fifth contract rides here for the same reason the second, third and
      # fourth do (#2114). Review-round narrative in source comments was swept
      # once by #2112 with no guard behind it, and the sweep's own command
      # (`review round [0-9]` over src/ and src-tauri/) did not cover the class:
      # the `review` word was optional and `e2e/` was outside the paths.
      # The class then regrew between that merge and this PR's base — compare
      # `git grep -cEi "round [0-9]|라운드 [0-9]" <rev> -- 'src/' 'src-tauri/'
      # 'e2e/'` at 642da83f against 38134c3c. A sweep without the gate in the
      # same PR does not hold. What counts as a violation is decided by
      # `scripts/check-round-narrative.sh` alone; its header states the rule.
      # Had this gate run on this PR's base it would have failed on the lines
      # this PR removes — the two counts match, from `git grep -nEi "round
      # [0-9]|라운드 [0-9]" 38134c3c -- 'src/' 'src-tauri/' 'e2e/' | wc -l` and
      # `git diff -U0 38134c3c -- 'src/' 'src-tauri/' 'e2e/' | grep '^-' |
      # grep -cEi "round [0-9]|라운드 [0-9]"`. PR and issue numbers stay: they
      # are the regression anchor the testing-scenarios convention asks for.
      # It lands in this job rather than one of its own because a required
      # context is registered in the `pr_to_main` ruleset, live GitHub state a
      # PR cannot change, and a freshly registered context that has never
      # reported pins every open PR at BLOCKED
      # (memory/runbook/pr-merge-gates/memory.md). Riding an already-required
      # context makes the check blocking the day this merges. The script needs
      # no toolchain: 0.09s, median of 9 local runs of
      # `/usr/bin/time -p bash scripts/check-round-narrative.sh` on macOS
      # against this branch's tree (the shell builtin `time` prints no `real`
      # line under zsh, so the command is spelled with the binary). No runner
      # measurement exists until this merges.
      - name: no review-round narrative in source comments
        run: bash scripts/check-round-narrative.sh

      # A sixth contract rides here for the same reason the second through
      # fifth do (#2174): a required context cannot be registered by the PR
      # that adds it, so riding one that is already required is what makes a
      # new check blocking on the day it merges
      # (memory/runbook/pr-merge-gates/memory.md). `(non-blocking)` is a name
      # this repo's release gate READS — release.yml drops check runs by that
      # suffix — so a job that carries the name without
      # `continue-on-error: true` is dropped from the release verdict while
      # still failing its own run. `WASM Size Budget (non-blocking)` was in
      # exactly that state until this PR. What counts as a violation is decided
      # by `scripts/check-non-blocking-jobs.sh` alone; its header states the
      # rule. The script needs no toolchain — awk and the shell — so it adds no
      # setup to the cheapest job. No timing figure is quoted here on purpose:
      # the one figure above that was re-measured (`check-ci-test-calls.sh`) did
      # not reproduce, and none of them record the machine, load, or warm/cold
      # state that would make two runs comparable. That gap is registered in
      # docs/roadmap/follow-up-queue.md under Quality gates; pinning the
      # conditions is that item's job, not this one's.
      - name: (non-blocking) job names carry continue-on-error
        run: bash scripts/check-non-blocking-jobs.sh

      # The second step that reads the PR body (#2228). It sits at the bottom
      # instead of next to the first one because it runs a script out of the
      # tree, so it has to be after `Checkout`; the body-path step above reads
      # the event payload and needs no tree. The body arrives through `env:`
      # for the same reason it does up there — a PR body is attacker-controlled
      # text, and `${{ ... }}` inside `run:` is substituted before bash parses
      # the line.
      #
      # What it enforces is that a universal claim carries the command that
      # would disprove it: the rule is memory/workflow/implementation/memory.md
      # §5 「새로 쓴 전칭 서술이 실측을 넘어섬」, and until now nothing measured
      # it. What counts as a violation is decided by
      # `scripts/check-pr-body-universals.sh` alone; its header states the rule,
      # including the six trigger words and what ±6 lines means.
      #
      # This does NOT check whether the body is true. It checks that six
      # Korean trigger words are not left standing without a command near them;
      # a false claim that uses none of those words passes untouched, and the
      # share of past blocking findings this shape covers is the number issue
      # #2228 pinned. Clearing a red needs a new commit, not a body edit — see
      # the `on:` comment at the top of this file.
      - name: Universal claims in PR body carry a command
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$BODY" ]; then
            echo "no PR body on this event — nothing to check"
            exit 0
          fi
          printf '%s\n' "$BODY" | bash scripts/check-pr-body-universals.sh

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: "0.19.9"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache cargo-deny
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install pinned cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}" >/dev/null; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --force
          fi
          cargo deny --version | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}"

      # Blocking gate. bans/licenses/sources are properties of *this PR's*
      # dependency set — a banned crate, disallowed license, or untrusted
      # source only appears when someone changes dependencies, so failing the
      # PR is the correct signal. Advisories are decoupled into the
      # `dependency-advisories` job below: a new RUSTSEC advisory is an external
      # event independent of the PR (2026-07-02 incident: one new advisory
      # turned 2 main pushes + 1 unrelated PR red at once).
      - name: Run cargo deny (bans, licenses, sources)
        working-directory: src-tauri
        run: cargo deny check bans licenses sources --hide-inclusion-graph

  dependency-advisories:
    name: Dependency Advisories (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Non-blocking (`continue-on-error`) advisory scan, split out of the
    # blocking gate above. A RUSTSEC advisory is an event about the outside
    # world, not about the code in any given PR, so it must never turn every
    # open PR and main push red at once (2026-07-02 incident). The signal stays
    # visible in the Actions log. Auto-filing an issue on failure is a
    # follow-up, out of scope for this PR.
    continue-on-error: true
    env:
      CARGO_DENY_VERSION: "0.19.9"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache cargo-deny
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install pinned cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}" >/dev/null; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --force
          fi
          cargo deny --version | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}"

      - name: Run cargo deny (advisories)
        working-directory: src-tauri
        run: cargo deny check advisories --hide-inclusion-graph

  # The vitest suite dominated `Frontend Checks` (437s of 532s), so it runs here
  # instead. Each shard emits a `blob` coverage slice as an artifact; `Frontend
  # Checks` merges them and grades the MERGED total, so the split weakens no
  # threshold (verified: merged and undivided runs report the same file set and
  # the same statement/line counts).
  frontend-shard:
    name: Frontend Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # One shard's failure must not cancel the others: the aggregation wants
      # every shard's real result, and a cancelled shard yields no blob at all.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # `scripts/__tests__/core-split-prose.test.ts` runs the core-split
          # sweep, which reads the #2082 split merge commit with `git diff-tree`.
          # The default depth-1 checkout has no such object, so the script dies
          # with `bad object` and the shard fails on empty output.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (shard ${{ matrix.shard }}/3)
        # `--coverage.thresholds.* 0` zeroes the global floors for this PARTIAL
        # run only: a 1/3 slice can never clear 85%. Enforcement moves to the
        # `Frontend Checks` merge step, which uses the config's real thresholds.
        # `default` is needed alongside `blob` — `blob` prints nothing, so a red
        # shard's log carried no assertion text. `--outputFile` applies to `blob`
        # only; `default` does not read it.
        run: |
          pnpm exec vitest run \
            --shard=${{ matrix.shard }}/3 \
            --coverage \
            --coverage.thresholds.lines 0 \
            --coverage.thresholds.statements 0 \
            --coverage.thresholds.functions 0 \
            --coverage.thresholds.branches 0 \
            --reporter=blob \
            --reporter=default \
            --outputFile=.vitest-reports/blob-${{ matrix.shard }}.json

      - name: Upload shard blob report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: frontend-shard
    # `always()` keeps this aggregation running when a shard FAILS, so the
    # grading step below turns a red shard into a red required check instead of
    # letting `needs` silently skip it (GitHub counts a skipped required check
    # as successful).
    if: always()

    steps:
      # Grade the matrix BEFORE any setup: with a failed shard there is no blob
      # to merge, and a missing-artifact error would mask the real cause.
      - name: Require test matrix success
        run: |
          if [ "${{ needs.frontend-shard.result }}" != "success" ]; then
            echo "Frontend test matrix result: ${{ needs.frontend-shard.result }}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Download shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .vitest-reports

      - name: Merge shard reports and enforce coverage thresholds
        # No threshold override here on purpose: vite.config.ts's real global
        # floors apply, and this merged report is the one that must clear them.
        # The blob count assertion below is the guard against a silently
        # weakened gate — 2 of 3 blobs would still "pass" a merge, at a
        # coverage number computed from two thirds of the suite.
        run: |
          test "$(ls .vitest-reports/blob-*.json | wc -l)" -eq 3 \
            || { echo "expected 3 shard blobs, got $(ls .vitest-reports/blob-*.json | wc -l)"; exit 1; }
          pnpm exec vitest --mergeReports=.vitest-reports \
            --coverage \
            --coverage.reporter=text-summary \
            --coverage.reporter=json-summary

      # #2126 — the step above enforces vite.config.ts's ABSOLUTE floors, which
      # sit 2-3 percentage points under the measured total; coverage can leak
      # that whole band without turning anything red. This step holds the band:
      # `coverage-baseline.json` carries the measured value and the gate fails
      # when the merged report drops below it. Its input is the
      # `json-summary` reporter added to the merge command above — drop that
      # flag here and this exits 2, not 0. What makes that true is the runner,
      # not the gate: the checkout is fresh and `/coverage/` is gitignored, so
      # nothing else can have written the file. Locally the same edit can still
      # exit 0 off a stale `coverage/coverage-summary.json`, because vitest's
      # `--mergeReports` path never calls `coverage.clean`.
      # It rides `Frontend Checks` rather than a job of its own because a
      # required context is registered in the `pr_to_main` ruleset, live GitHub
      # state a PR cannot change, and a freshly registered context that has
      # never reported pins every open PR at BLOCKED
      # (memory/runbook/pr-merge-gates/memory.md). Of the required contexts this
      # is the only one that measures frontend coverage, so the ratchet is
      # blocking the day it merges. It reads a file the previous step already
      # wrote: no toolchain, no extra suite run.
      - name: Coverage ratchet
        run: node scripts/check-coverage-ratchet.mjs

      - name: Build
        run: pnpm build

  rust:
    name: Rust Unit And Storage Tests
    runs-on: macos-latest
    # 20 -> 35 (#1769), kept at 35 (#2161). The cap exists because the
    # rust-cache `workspaces:` list below is hashed into the actions/cache
    # *version*, and an entry only restores into a run whose version matches —
    # so every edit to that list buys one guaranteed cold run. #1769's edit cost
    # run 30658756471 a "No cache found" and two cold manifest compiles
    # (10m21s + 8m43s), which blew the old 20-minute cap at 20m20s and skipped
    # the steps behind it. #2161 shortens the list instead of growing it: the
    # workspace members now share one target dir, so the cold pass compiles the
    # dependency set (duckdb bundled dominates it) once rather than once per
    # manifest. 35 stays as headroom for that one cold run; warm runs were
    # 4m14s on main before and have less to rebuild now. Adding a member (#1770
    # added `tvw`) needs no line here — it joins through the workspace.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # #2161 — one entry, because the crates are one Cargo workspace and
          # share `src-tauri/target`. Until then each crate compiled into its
          # own target dir and needed its own line here; miss one and that
          # crate recompiled every run (audit 2026-07-03). A new member joins
          # through `src-tauri/Cargo.toml`'s `members`, not through this list.
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # #2161 — `--workspace --lib` is what makes a new crate arrive already
      # tested. Before the workspace this was a step per crate, and the
      # same omission was found three times: #1769 (1175 of the 1978 `--lib`
      # tests stopped running when db/models/storage/error moved to
      # `table-view-core`), sprint-390 (`sql-parser-core`'s 31 lib tests),
      # #2098 (`mongosh-parser-core`'s 55). Each time CI stayed green while the
      # tests sat unrun, because `cargo test` reaches only the package it is
      # called on.
      #
      # The `--test` names stay hand-listed and that is deliberate: they are an
      # allowlist, not an omission. Dropping them for a bare `cargo test
      # --workspace` would pull in every `src-tauri/tests/*.rs` binary,
      # including the Docker-backed ones that belong to `Integration Tests
      # (Docker)` and cannot run on this runner. `scripts/check-ci-test-calls.sh`
      # is the gate on that list: every integration target is either named here
      # (or in the coverage job) or carries a reason in `ci-uncalled-tests.txt`.
      #
      # `keyring_*` (#1815) sits in this job rather than the coverage job on
      # purpose — that job carries `--fail-under-*` ratchets and adding targets
      # there moves the denominator.
      - name: Run cargo tests
        working-directory: src-tauri
        run: |
          cargo test --workspace --lib \
            --test storage_integration \
            --test parse_sql_backend \
            --test keyring_migration \
            --test keyring_new_user \
            --test keyring_linux_fallback

  # Advisory, and it stays advisory by construction (#2127, owner's call).
  # Required contexts are listed in the `pr_to_main` ruleset — live GitHub state
  # no PR can edit — so a job whose name is absent from that list cannot block a
  # merge: an over-budget red here leaves `mergeStateStatus` at UNSTABLE, which
  # still merges. memory/runbook/pr-merge-gates/memory.md owns that list;
  # putting this name on it is what would make the budget blocking, and that is
  # a separate decision, taken after the job has reported on main.
  #
  # Nothing in CI built the parser WASM before this job: pinned to this PR's
  # base, `git grep -n wasm-pack a6032a14 -- .github/workflows` returns 0 hits.
  # The gate this rebuilds (`git show 6cced3ab^:scripts/check-wasm-size.sh`,
  # deleted by #2033) only measured the CHECKED-IN blob, so it graded whatever
  # was last committed instead of what the PR's Rust source compiles to. This
  # job builds first, then measures — which is why the build step is in scope.
  #
  # No `Swatinem/rust-cache` here on purpose. From an absent target dir the two
  # crates build in 14.48s (sql) and 23.00s (mongo) locally — wasm-pack's own
  # `Done in` line for each `wasm-pack build --target web --features wasm` — and
  # rust-cache keys include the job name, so this job would open cache entries
  # of its own that only main can save. Not worth the moving parts on an
  # advisory job; add it if the cold build ever crowds the runner.
  wasm-size:
    name: WASM Size Budget (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The name promised this and the job did not deliver it until #2174: an
    # over-budget commit ended this whole workflow run red. What the flag
    # changes is the RUN's conclusion, not this job's. Measured on a throwaway
    # branch (a `continue-on-error: true` job whose only step was `exit 1`):
    # the job's check run still reports `conclusion: failure`, while the run it
    # belongs to reports `success`
    # (https://github.com/Felix-LeeSM/table-view/actions/runs/31017294699
    # against the control https://github.com/Felix-LeeSM/table-view/actions/runs/31017295684).
    # So a blown budget still shows red on the commit's check list and still
    # merges (the name is absent from the `pr_to_main` ruleset, per the comment
    # above); what it no longer does is drag the rest of CI's verdict down with
    # it. `scripts/check-non-blocking-jobs.sh` is what keeps the two in step
    # from here on.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown

      # Same pinned-prebuilt installer the integration job uses for
      # cargo-llvm-cov/nextest, so no per-run source build lands here.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      # pnpm and Node are here only to run the two `build:*-wasm` scripts, which
      # own the wasm-pack flags (`--target web`, `--features wasm`, out-dir).
      # Spelling wasm-pack out again in this file would fork those flags into a
      # second copy that drifts. No `pnpm install`: neither script reads
      # node_modules.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0

      # These write into the tracked `src/lib/**/wasm/` output dirs, which is
      # exactly what the check below reads: on this ephemeral checkout the fresh
      # build replaces the committed artifacts, so the measured bytes are the
      # ones this PR's source produces. (Locally the same commands overwrite
      # your checkout, including the comment-only `.gitignore` wasm-pack
      # replaces with `*` — run the check alone to grade the committed blob.)
      - name: Build parser WASM
        run: |
          pnpm run build:sql-wasm
          pnpm run build:mongosh-wasm

      # Budgets, their derivation and the reproduction commands live in the
      # script's header, not here — one copy.
      - name: Check WASM gzip size budgets
        run: bash scripts/check-wasm-size.sh

  rust-static:
    name: Rust Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # clippy --all-features pulls the full Tauri feature graph, which needs
      # the WebKitGTK/GTK system libraries to compile on Linux. Mirrors the
      # integration-tests job's apt step.
      - name: Install Tauri Linux dependencies
        # Retry wrapper (#1293): transient apt mirror failures (e.g.
        # packages.microsoft.com 403) fail the whole setup. Up to 3 attempts
        # with linear backoff.
        run: |
          install_deps() {
            sudo apt-get update && sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          }
          for i in 1 2 3; do
            install_deps && exit 0
            echo "apt install attempt $i failed; retrying in $((i * 10))s" >&2
            sleep "$((i * 10))"
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # #2161 — one workspace, one target dir. See the sibling comment in
          # the `rust` job for what editing this list costs.
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # #2161 — `--all` / `--workspace` instead of a step per crate. #1769
      # needed a second pair of steps here because `cargo fmt` and `cargo
      # clippy` reach only the package they are invoked on, and without them
      # over half the Rust source (the db/models/storage/error tree that moved
      # to `table-view-core`) left both gates while CI stayed green. The
      # workspace flags cover every member, so the parser crates — which no fmt
      # or clippy gate had ever reached — are in now too.
      # clippy still reads `clippy.toml` per crate from CARGO_MANIFEST_DIR,
      # which is why `table-view-core` keeps its own copy.
      # `lefthook.yml` runs the same `cargo fmt --all --check` on pre-push, so
      # formatting is caught locally first and this is the second line of
      # defence. Clippy has no local counterpart and only runs here.
      - name: Rustfmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # #2184 — `table-view-core`'s `testing` feature switches on the
      # `TABLE_VIEW_TEST_DATA_DIR` override (`storage::data_dir_override`). That is
      # how release *test* builds isolate themselves, and it is why a shipped
      # binary must never carry the feature: with it on, anyone who can set an env
      # var moves the app's data directory — the master `.key`, connections.json
      # and state.db with it (#1454).
      #
      # Before this step that property was only a comment. It is checked by asking
      # cargo, not by searching the manifests: enabling a feature for a normal
      # build has no single spelling (core's own `[features] default`, an inline
      # table, a `[dependencies.table-view-core]` table, a
      # `default = ["table-view-core/testing"]` forward, a renamed `package = ...`
      # entry), and a scanner tuned to one reports 0 for the rest.
      #
      # `--edges normal` picks the graph `cargo build --release` / `cargo tauri
      # build` resolves from, and `--format '{f}'` prints the feature set cargo
      # RESOLVED for the package there — not the edges it walked to get there.
      # That distinction is the whole check. #2184 shipped this as
      # `-e features ... | grep 'feature "testing"'`, which reads the edge labels
      # and is blind to feature resolver 1: resolver 1 unifies dev-dependency
      # features into a plain `cargo build`, and the edge view does not show it.
      # #2161 re-measured that on a throwaway probe (an app package plus a core
      # package, core a normal dep and a dev-dep-with-feature under a virtual
      # workspace root):
      #
      #   resolver absent  -> released binary reports the feature ON,
      #                       `-e features --edges normal` prints only
      #                       `feature "default"`, `--format '{f}'` prints
      #                       `default,testing`
      #   resolver = "2"   -> binary OFF, `{f}` prints `default`
      #
      # So the `{f}` form catches both bypasses with one assertion — a
      # `default = ["testing"]` in core's manifest, and a workspace that has
      # fallen back to resolver 1 — and #2184's second arm (asserting no
      # workspace root exists at all) is no longer needed to cover the second.
      # `src-tauri/Cargo.toml` now IS the workspace root and sets
      # `resolver = "2"`; a virtual manifest added above it without that key is
      # the live hazard, and this step sees it.
      #
      # What the removed arm also happened to cover: it refused any root above
      # `src-tauri`, and such a root would change which packages the coverage
      # job selects by default, pulling `table-view-core` into the
      # `--fail-under-*` denominator (see that job's comment). This step does
      # not check that, and nothing else does either. It is fail-loud rather
      # than silent — the ratio drops below the floor and the job goes red — so
      # it is a lost early warning, not a lost gate.
      - name: Test-only data-dir override stays out of the release graph
        working-directory: src-tauri
        run: |
          set -euo pipefail

          features="$(cargo tree -i table-view-core --edges normal \
            --format '{f}' --prefix none | head -1)"
          echo "table-view-core features in the release graph: [$features]"
          case ",$features," in
            *,testing,*)
              echo "::error file=src-tauri/table-view-core/Cargo.toml::#2184/#1454: table-view-core's 'testing' feature is enabled in the release dependency graph. It enables the TABLE_VIEW_TEST_DATA_DIR override, so a shipped binary could be pointed at an attacker-chosen data directory. Keep it in [dev-dependencies] only, and keep resolver = \"2\" on the workspace root — resolver 1 unifies dev-dependency features into cargo build."
              exit 1
              ;;
          esac

  # 2026-07-25 — this job was briefly split into a 4-way `integration-shard`
  # matrix and reverted after measurement on run 30142745666. Partitioning by
  # test binary made it SLOWER, not faster: the slowest shard (mysql-family)
  # took 1294s against 1028s for the whole undivided job. The bottleneck is not
  # aggregate CPU but the `max-threads = 1` test groups in
  # src-tauri/.config/nextest.toml (`mysql-integration`, `mongo-integration`,
  # pinned for shared-catalog contention #1240/#1244). Inside one job those
  # serialised tests interleave with other binaries across all 4 threads; alone
  # in a shard they run single-threaded with 3 cores idle while every shard
  # re-pays checkout + apt + toolchain + 70s compile + container startup. Do not
  # re-split this job on test-binary lines — fix the serialisation first (give
  # the MySQL/Mongo tests private databases so the groups can lift), and only
  # then revisit. Frontend sharding is unaffected and stays: its suite has no
  # equivalent serial pin.
  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    # 60, not 40: the instrumented `cargo llvm-cov nextest` build plus the
    # MySQL/MSSQL testcontainers do not fit a plain-test budget.
    timeout-minutes: 60

    # Sprint 237 P5+ (2026-05-08) — PG/Mongo 둘 다 GHA service container 로
    # 띄우고 환경변수로 endpoint 를 노출. tests/common/mod.rs 의
    # pg_endpoint/mongo_endpoint helper 가 PGHOST/MONGO_HOST 가 있으면
    # testcontainers 를 띄우지 않고 외부 인스턴스를 그대로 재사용하므로,
    # GHA service 와 testcontainers 가 자연스럽게 swap-in/out 된다.
    # Redis는 별도 GHA service 없이 `redis_integration` testcontainer 가
    # 자체 lifecycle 을 소유한다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: table_view_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d table_view_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mongodb:
        # auth 비활성 default. tests/common/mod.rs 가 user 없는 익명 연결
        # 을 지원하므로 추가 셋팅 불필요.
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        # Retry wrapper (#1293): transient apt mirror failures (e.g.
        # packages.microsoft.com 403) fail the whole setup. Up to 3 attempts
        # with linear backoff. The `Rust Static Analysis` job above runs the
        # same loop.
        run: |
          install_deps() {
            sudo apt-get update && sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          }
          for i in 1 2 3; do
            install_deps && exit 0
            echo "apt install attempt $i failed; retrying in $((i * 10))s" >&2
            sleep "$((i * 10))"
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          # llvm-tools-preview backs `cargo llvm-cov`'s source-based coverage.
          components: llvm-tools-preview

      # cargo-llvm-cov + cargo-nextest back the integration coverage gate below.
      # taiki-e/install-action downloads pinned prebuilt binaries and caches
      # them, so no per-run source build lands on the 40m+ critical path.
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-nextest@0.9.137

      - name: Show disk usage before integration build
        run: |
          df -h /
          du -sh src-tauri/target 2>/dev/null || true
          docker system df || true

      # Do not add SDK deletions or `docker system prune -af` here (measured
      # 2026-07-25): they cost 135s, the runner already reports 86G free of 145G,
      # the prune reclaimed 1.765GB, and it evicts preloaded base images the
      # MySQL/MSSQL/Redis/Oracle testcontainers then re-pull. `apt-get clean` is
      # sub-second. `Show disk usage` above is the signal if pressure returns.
      - name: Free disk headroom before integration build
        run: |
          sudo apt-get clean
          df -h /

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Rust integration coverage gate (audit 2026-07-03 #6) — this is the only
      # thing enforcing the integration coverage floor, and it both runs the
      # tests and grades them, so there is no separate plain `cargo test` step.
      # Thresholds are literals below; nothing else stores them. PG/Mongo reuse
      # the GHA services via PGHOST/MONGO_HOST, MySQL/MSSQL/Redis fall back to
      # their own testcontainers.
      # No `--workspace` here, unlike the `rust` job (#2161): what lands in the
      # report is the source of the SELECTED packages, and with no selection
      # flag that is the workspace root package `table-view` alone. Measured on
      # a two-crate probe, adding `table-view-core` as a member changed neither
      # the file list nor the totals. Adding `--workspace` would — core's tree
      # would join the denominator and the three literals below would then be
      # grading a different population.
      - name: Run integration coverage
        working-directory: src-tauri
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: testuser
          PGPASSWORD: testpass
          PGDATABASE: table_view_test
          MONGO_HOST: localhost
          MONGO_PORT: 27017
        run: |
          cargo llvm-cov nextest --profile push --lib \
            --test storage_integration \
            --test query_integration \
            --test schema_integration \
            --test value_search_integration \
            --test fixture_loading \
            --test mongo_integration \
            --test mysql_integration \
            --test duckdb_file_analytics \
            --test mariadb_ddl_preview \
            --test mariadb_integration \
            --test mssql_connection_routing \
            --test mssql_integration \
            --test oracle_integration \
            --test redis_integration \
            --summary-only \
            --fail-under-lines 80 \
            --fail-under-functions 75 \
            --fail-under-regions 80

  # #2323 (#1770 AC-1 slice 3) — `tvw query --url` against ADR 0061's four SQL
  # engines. Until this job existed, `src-tauri/tvw/tests/query_url_live.rs` was
  # named by no workflow line, and `--test` is an allowlist: an integration
  # target nobody names never runs.
  #
  # Nothing guards that for this crate. `scripts/check-ci-test-calls.sh` is the
  # gate that catches an uncalled integration target, and its scan root is
  # `src-tauri/tests` alone — it does not reach `src-tauri/tvw/tests`, so
  # deleting the `--test` line below would not turn any check red. Widening that
  # scan is a follow-up, out of this issue's two-path scope.
  #
  # A job of its own rather than a step inside `Integration Tests (Docker)`.
  # That job runs its whole suite through `cargo llvm-cov nextest`, whose
  # instrumentation RUSTFLAGS and target directory are cargo-llvm-cov's own, so
  # a plain `cargo test` step beside it reuses none of its artifacts and pays
  # this crate's graph from scratch wherever it sits. Selecting `-p tvw` inside
  # that coverage command instead is what its own comment warns against for
  # `--workspace`: its `--fail-under-*` literals would then grade a different
  # population. Splitting also keeps a failure here off the job that carries
  # those literals, and lets the two DB sets stay apart — that job's MySQL and
  # MariaDB coverage comes from testcontainers started inside its test binaries,
  # which expose nothing to a sibling process.
  #
  # One system library, not the WebKitGTK/GTK set `Rust Static Analysis` and
  # `Integration Tests (Docker)` install. `tvw` links `table-view-core` and
  # nothing from Tauri (src-tauri/tvw/Cargo.toml), but that core reaches
  # `libdbus-sys` on Linux through keyring's secret-service backend:
  #
  #   cargo tree -p tvw --target x86_64-unknown-linux-gnu --edges normal \
  #     --invert libdbus-sys
  #   # libdbus-sys 0.2.7 <- dbus 0.9.11 <- dbus-secret-service 4.1.0
  #   #                   <- keyring 3.6.3 <- table-view-core <- tvw
  #
  # The other two jobs never needed a line for it because `libgtk-3-dev` pulls
  # it in. macOS resolves that edge to Security.framework instead, so a local
  # build proves nothing about it — this job's first push compiled clean here
  # and died on the missing `dbus-1.pc`:
  # https://github.com/Felix-LeeSM/table-view/actions/runs/31698995240/job/94443268969
  #
  # This `name:` is NOT on the `pr_to_main` required-context list. That list is
  # live GitHub state a PR cannot edit, and a freshly registered context that has
  # never reported pins every open PR at BLOCKED
  # (memory/runbook/pr-merge-gates/memory.md); registering it is a separate
  # decision, taken after this job has reported on main. Until then a red here
  # leaves `mergeStateStatus` at UNSTABLE, which still merges. The name carries
  # no `(non-blocking)` suffix on purpose — release.yml DROPS check runs by that
  # suffix from the release verdict, and this one should count there.
  cli-live-query:
    name: CLI Live Query (Docker)
    runs-on: ubuntu-latest
    # One guaranteed cold compile: `Swatinem/rust-cache` keys its entries by job,
    # so this job opens entries of its own that only main can save. The graph is
    # `table-view-core`'s, whose `duckdb` is bundled C++ source — the same cost
    # that holds the `rust` job at 35. Locally that graph builds in 4m45s
    # (`cargo build -p tvw --bin tvw` from an absent target dir, macOS, one run
    # under other load). No runner measurement exists for THIS job until it
    # merges, so 45 is headroom over a local figure plus three service
    # containers, not a number read off a run.
    timeout-minutes: 45

    # Ports mirror docker-compose.yml, so a local `pnpm db:up` run and this one
    # use one set of numbers. MySQL and MariaDB both listen on 3306 inside their
    # container, so their host ports have to differ. Credentials are the
    # testuser/testpass pair the compose file, the app's integration helpers and
    # the smoke fixtures already share.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: table_view_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d table_view_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_DATABASE: table_view_test
        ports:
          - 13306:3306
        # `-h 127.0.0.1` on purpose, not the compose file's `localhost`: that
        # spelling reaches the unix socket, and mysql's entrypoint runs its
        # initialisation on a socket-only temporary server. Over TCP the probe
        # can only succeed once the real server is listening, which is the state
        # the test needs.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ptestroot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: testroot
          MARIADB_USER: testuser
          MARIADB_PASSWORD: testpass
          MARIADB_DATABASE: table_view_test
        ports:
          - 23306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Just the one library the job comment traces, not the Tauri set.
      # Retry wrapper (#1293): transient apt mirror failures fail the whole
      # setup. `Rust Static Analysis` and `Integration Tests (Docker)` run the
      # same loop over their own package list.
      - name: Install libdbus for keyring's Linux backend
        run: |
          install_deps() {
            sudo apt-get update && sudo apt-get install -y libdbus-1-dev
          }
          for i in 1 2 3; do
            install_deps && exit 0
            echo "apt install attempt $i failed; retrying in $((i * 10))s" >&2
            sleep "$((i * 10))"
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Same single entry as the other Rust jobs — one workspace, one target
          # dir. Adding a line to this list is what buys a guaranteed cold run
          # for every job that shares it (#1769); a new member joins through
          # `src-tauri/Cargo.toml`'s `members`, not here.
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The four engines are ADR 0061's SQL core. SQLite needs no server and no
      # variable — the test makes an empty file. The other three read a host
      # variable as their gate, and an unset gate is not a silent skip: `skip()`
      # in that file asserts on `CI`, so a missing endpoint fails the job rather
      # than reporting PASS for a query that never ran. Verified locally by
      # running the binary with `CI=1` and no host variables — three failures,
      # one per server engine.
      - name: Run tvw live query tests
        working-directory: src-tauri
        env:
          PGHOST: localhost
          PGPORT: 15432
          PGUSER: testuser
          PGPASSWORD: testpass
          PGDATABASE: table_view_test
          MYSQL_HOST: localhost
          MYSQL_PORT: 13306
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
          MYSQL_DATABASE: table_view_test
          MARIADB_HOST: localhost
          MARIADB_PORT: 23306
          MARIADB_USER: testuser
          MARIADB_PASSWORD: testpass
          MARIADB_DATABASE: table_view_test
        run: cargo test -p tvw --test query_url_live

  # Job `name:` values are load-bearing: the `pr_to_main` ruleset lists required
  # contexts by name, so renaming one silently un-gates main. That list is live
  # GitHub state — memory/runbook/pr-merge-gates/memory.md tracks it.
  # `Runtime Happy Path` comes from .github/workflows/e2e-smoke.yml.
