name: CI

# Trigger policy:
# - `push` on `main` only: validates what actually landed (post-merge gate).
# - `pull_request`: validates feature branches before they merge.
# This avoids the duplicate run that fires when an open PR's branch is
# pushed (push + pull_request would each schedule a separate workflow on
# the same SHA).
#
# No `edited`, even though `pr-body` below now reads the PR body: adding it
# would re-run the six required checks this workflow reports (~20 min) on every
# body edit. Six, not seven — the seventh required context, `Runtime Happy
# Path`, lives in e2e-smoke.yml, which does not listen for `edited` either. The
# cost of leaving it off is that a red `PR Body Contract` clears only on the
# next commit — a job re-run replays the original event payload, so it
# re-reads the OLD body and fails again. Fix the body, then push.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

# Cancel policy differs by event (audit 2026-07-03):
# - pull_request: cancel in-flight runs when a newer commit arrives — the old
#   run is stale the moment a new commit lands, and fast feedback wins.
# - push to main: do NOT cancel. Let the running post-merge run finish; GitHub
#   keeps at most one running + one pending per group and replaces the pending
#   one, so a burst of N merges converges to first-run + last-run = 2 runs.
#   Cancelling on main could leave zero main runs ever completing during a merge
#   wave, which (a) forfeits the rust-cache main save (only main writes the
#   shared cache) and (b) opens a post-merge verification gap — the background
#   condition behind the 3-week-frozen partial e2e cache. Cost: the tip-of-main
#   signal lags by up to one run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # `PR Body Contract` is a required context in the `pr_to_main` ruleset (live
  # GitHub state); a name that stops reporting stays "expected" and blocks every
  # merge, so the `name:` is load-bearing — do not rename it. Drop the ruleset
  # entry before deleting this job. No job is change-gated — everything below
  # runs on every event.
  pr-body:
    name: PR Body Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The PR body is the evidence a reviewer reads on github.com, so a path
      # that only resolves on the author's machine is evidence nobody else can
      # open. SOT for the rule: memory/workflow/delivery/memory.md 「PR body」.
      #
      # The body arrives through `env:`, never interpolated into the script: a
      # PR body is attacker-controlled text, and `${{ ... }}` inside `run:` is
      # substituted before bash parses the line, so a body containing `$(...)`
      # or a backtick would execute here.
      - name: Reject non-portable paths in PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$BODY" ]; then
            echo "no PR body on this event — nothing to check"
            exit 0
          fi
          if printf '%s\n' "$BODY" | grep -n -F \
            -e '/Users/' -e '/tmp/' -e 'file://' -e 'worktrees/' -e 'clones/'; then
            echo "::error::PR body carries a non-portable path (matching lines above, numbered from the top of the body). Use repo-relative paths and URLs that open on github.com. SOT: memory/workflow/delivery/memory.md 「PR body」. This check re-runs on the next commit, not on a body edit."
            exit 1
          fi
          echo "PR body clean — no non-portable path patterns."

      # A second, unrelated contract rides in this job: CLAUDE.md's
      # `@AGENTS.md` line. That one line is what loads the agent rules into
      # every harness and every spawned subagent — rewritten as a markdown link
      # it stopped being delivered (#1865). Nothing has ever checked the line
      # itself: the doc-link checker #2033 deleted collected inline, reference
      # and href/src links only, with no branch for a line-leading `@path`
      # (`git show 6cced3ab^:scripts/check-doc-links.ts`), and `git log --all
      # -S '@AGENTS.md' -- scripts .github` finds no other checker. What that
      # one did cover is CLAUDE.md's separate `[AGENTS.md](AGENTS.md)` link —
      # the `test -f` half below, never the import. It lives here because this
      # is the cheapest job with no change gate, so the guard runs on every PR
      # and every push to main; the job `name:` is a required context, so it
      # cannot be renamed to match. Checkout is needed only by this step — the
      # PR body step above reads its input from the event payload. A red here
      # is diagnosed from memory/runbook/pr-merge-gates/memory.md.
      - name: Checkout
        uses: actions/checkout@v6

      # `-x` pins the whole line and `-F` keeps the `.` literal, so the import
      # must survive verbatim; `test -f` covers the other half, an import
      # pointing at a file nobody kept.
      - name: CLAUDE.md import intact
        run: grep -qxF '@AGENTS.md' CLAUDE.md && test -f AGENTS.md

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_DENY_VERSION: "0.19.9"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache cargo-deny
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install pinned cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}" >/dev/null; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --force
          fi
          cargo deny --version | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}"

      # Blocking gate. bans/licenses/sources are properties of *this PR's*
      # dependency set — a banned crate, disallowed license, or untrusted
      # source only appears when someone changes dependencies, so failing the
      # PR is the correct signal. Advisories are decoupled into the
      # `dependency-advisories` job below: a new RUSTSEC advisory is an external
      # event independent of the PR (2026-07-02 incident: one new advisory
      # turned 2 main pushes + 1 unrelated PR red at once).
      - name: Run cargo deny (bans, licenses, sources)
        working-directory: src-tauri
        run: cargo deny check bans licenses sources --hide-inclusion-graph

  dependency-advisories:
    name: Dependency Advisories (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Non-blocking (`continue-on-error`) advisory scan, split out of the
    # blocking gate above. A RUSTSEC advisory is an event about the outside
    # world, not about the code in any given PR, so it must never turn every
    # open PR and main push red at once (2026-07-02 incident). The signal stays
    # visible in the Actions log. Auto-filing an issue on failure is a
    # follow-up, out of scope for this PR.
    continue-on-error: true
    env:
      CARGO_DENY_VERSION: "0.19.9"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache cargo-deny
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install pinned cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}" >/dev/null; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --force
          fi
          cargo deny --version | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}"

      - name: Run cargo deny (advisories)
        working-directory: src-tauri
        run: cargo deny check advisories --hide-inclusion-graph

  # The vitest suite dominated `Frontend Checks` (437s of 532s), so it runs here
  # instead. Each shard emits a `blob` coverage slice as an artifact; `Frontend
  # Checks` merges them and grades the MERGED total, so the split weakens no
  # threshold (verified: merged and undivided runs report the same file set and
  # the same statement/line counts).
  frontend-shard:
    name: Frontend Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # One shard's failure must not cancel the others: the aggregation wants
      # every shard's real result, and a cancelled shard yields no blob at all.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (shard ${{ matrix.shard }}/3)
        # `--coverage.thresholds.* 0` zeroes the global floors for this PARTIAL
        # run only: a 1/3 slice can never clear 85%. Enforcement moves to the
        # `Frontend Checks` merge step, which uses the config's real thresholds.
        # `default` is needed alongside `blob` — `blob` prints nothing, so a red
        # shard's log carried no assertion text. `--outputFile` applies to `blob`
        # only; `default` does not read it.
        run: |
          pnpm exec vitest run \
            --shard=${{ matrix.shard }}/3 \
            --coverage \
            --coverage.thresholds.lines 0 \
            --coverage.thresholds.statements 0 \
            --coverage.thresholds.functions 0 \
            --coverage.thresholds.branches 0 \
            --reporter=blob \
            --reporter=default \
            --outputFile=.vitest-reports/blob-${{ matrix.shard }}.json

      - name: Upload shard blob report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: frontend-shard
    # `always()` keeps this aggregation running when a shard FAILS, so the
    # grading step below turns a red shard into a red required check instead of
    # letting `needs` silently skip it (GitHub counts a skipped required check
    # as successful).
    if: always()

    steps:
      # Grade the matrix BEFORE any setup: with a failed shard there is no blob
      # to merge, and a missing-artifact error would mask the real cause.
      - name: Require test matrix success
        run: |
          if [ "${{ needs.frontend-shard.result }}" != "success" ]; then
            echo "Frontend test matrix result: ${{ needs.frontend-shard.result }}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Download shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .vitest-reports

      - name: Merge shard reports and enforce coverage thresholds
        # No threshold override here on purpose: vite.config.ts's real global
        # floors apply, and this merged report is the one that must clear them.
        # The blob count assertion below is the guard against a silently
        # weakened gate — 2 of 3 blobs would still "pass" a merge, at a
        # coverage number computed from two thirds of the suite.
        run: |
          test "$(ls .vitest-reports/blob-*.json | wc -l)" -eq 3 \
            || { echo "expected 3 shard blobs, got $(ls .vitest-reports/blob-*.json | wc -l)"; exit 1; }
          pnpm exec vitest --mergeReports=.vitest-reports \
            --coverage \
            --coverage.reporter=text-summary

      - name: Build
        run: pnpm build

  rust:
    name: Rust Unit And Storage Tests
    runs-on: macos-latest
    # 20 -> 35 (#1769). Adding `src-tauri/table-view-core -> target` to the
    # rust-cache workspaces below changes the actions/cache *version* — that
    # version is a hash of the cached path list, and an entry only restores
    # into a run whose version matches. Every entry saved before this PR was
    # therefore invisible to it: run 30658756471 logged "No cache found" and
    # cold-compiled both manifests (10m21s + 8m43s), hitting the old 20-minute
    # cap at 20m20s and skipping the two steps behind it. Same run's
    # `Integration Tests (Docker)`, whose path list this PR does not touch,
    # restored on the prefix key ("full match: false") — that is the control.
    # A full cold pass measures ~23m; 35 keeps the headroom ratio the sibling
    # rust-static job already carries (30 for a 21m03s cold run). Warm runs are
    # unaffected (4m14s on main): once this merges, main saves under the new
    # version and later PRs restore it.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # sql-parser-core and table-view-core are path crates (not workspace
          # members), so the standalone `--manifest-path .../Cargo.toml` tests
          # below compile into their OWN target dirs. Caching only
          # `src-tauri -> target` left them uncached, recompiling every run
          # (audit 2026-07-03). List each target as a separate workspace —
          # unless a cold compile is cheaper than invalidating this list, which
          # is the mongosh-parser-core step's reasoning at the end of this job.
          workspaces: |
            src-tauri -> target
            src-tauri/sql-parser-core -> target
            src-tauri/table-view-core -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --test storage_integration

      # #1769 — db/models/storage/error moved into the `table-view-core` path
      # crate, taking 1175 of the 1978 pre-split `--lib` tests with them. The
      # line above only runs `table-view`'s own lib tests, so without this step
      # those 1175 would stop running while CI stayed green. Same wiring the
      # sql-parser-core step below got for the same reason.
      - name: Run table-view-core unit tests
        run: cargo test --manifest-path src-tauri/table-view-core/Cargo.toml --lib

      # Sprint 390 (2026-05-17) — sprint-385 review found that the
      # `sql-parser-core` path crate's 31 lib tests and the
      # `parse_sql_backend` integration test (2 tests) were NOT covered
      # by the Rust job above: the previous `cargo test --manifest-path
      # src-tauri/Cargo.toml --lib --test storage_integration` line only
      # runs `table-view`'s lib tests + one named integration target.
      # Wire them in as separate steps so a regression in either set
      # fails CI. Steps run serially with default `if: success()` — a
      # failure in the table-view lib tests short-circuits the rest,
      # which is the desired blast-radius behavior (fix upstream first).
      - name: Run sql-parser-core unit tests
        run: cargo test --manifest-path src-tauri/sql-parser-core/Cargo.toml --lib
      - name: Run parse_sql_backend integration test
        run: cargo test --manifest-path src-tauri/Cargo.toml --test parse_sql_backend

      # #1815 (2026-08-02) — the same omission as the two comments above, found
      # again on the master-key lifecycle. `--test` is an allowlist, so the
      # `keyring_*` binaries had never run in CI: pinned to the base commit,
      # `git grep -i keyring c085c31b -- .github/workflows/` still returns 0
      # hits, and the coverage job below names its integration targets one by
      # one with no keyring among them. They pass and always did — they
      # simply gated nothing, which is why a `secure_delete` gutted to a bare
      # unlink stays green across the whole pre-existing suite.
      # Wired into this plain-test job rather than the coverage job on purpose:
      # the coverage job carries `--fail-under-*` ratchets and adding targets
      # there moves the denominator. Promote them if the key lifecycle ever
      # needs a coverage floor of its own.
      - name: Run keyring lifecycle integration tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml \
            --test keyring_migration \
            --test keyring_new_user \
            --test keyring_linux_fallback

      # #2098 — a third crate whose lib tests no gate ran: pinned to the base
      # commit, `git grep -n mongosh-parser dd1d9d0a -- .github` returns 0 hits.
      # The cause differs from the two steps above, though. Those crates are
      # path dependencies, which the app manifest compiles without running their
      # tests; this one is absent from the app's dependency graph entirely
      # (`git grep -n mongosh -- src-tauri/Cargo.lock` returns 0 hits), so no
      # flag on the app manifest could have reached it. lefthook names the crate
      # too but for a different gap — its cargo-fmt hooks skip it because CI
      # does not fmt-check it either, which is about formatting, not tests.
      # The 55 tests (parser 38, lexer 12, lib 4, completion 1) pass and always
      # did; they simply gated nothing.
      # Deliberately left out of the rust-cache `workspaces:` list above, so
      # this crate compiles cold every run: 12 crates from an absent target dir,
      # 6.65s, a 6s step of a 4m12s job (run 30779382990). Its native dep graph
      # is serde + serde_json; the wasm-bindgen deps sit behind the
      # off-by-default `wasm` feature.
      # Listing the path would change the actions/cache version and stop every
      # entry saved so far from restoring — a one-time transition, not a
      # per-run cost, because `save-if` above saves only on main: the branch
      # pays cold runs until it merges, then main re-saves under the new
      # version (~23m for a cold pass, per this job's timeout comment). So the
      # trade is 6.65s every run against ~23m once, break-even near 200 runs —
      # taken because a ~23m pass also eats most of the 35m cap. Revisit if
      # this crate's dependency graph grows.
      - name: Run mongosh-parser-core unit tests
        run: cargo test --manifest-path src-tauri/mongosh-parser-core/Cargo.toml --lib

  rust-static:
    name: Rust Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # clippy --all-features pulls the full Tauri feature graph, which needs
      # the WebKitGTK/GTK system libraries to compile on Linux. Mirrors the
      # integration-tests job's apt step.
      - name: Install Tauri Linux dependencies
        # Retry wrapper (#1293): transient apt mirror failures (e.g.
        # packages.microsoft.com 403) fail the whole setup. Up to 3 attempts
        # with linear backoff.
        run: |
          install_deps() {
            sudo apt-get update && sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          }
          for i in 1 2 3; do
            install_deps && exit 0
            echo "apt install attempt $i failed; retrying in $((i * 10))s" >&2
            sleep "$((i * 10))"
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/table-view-core -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `lefthook.yml` runs the same `cargo fmt --check` on pre-push for both
      # manifests, so formatting is caught locally first and this is the second
      # line of defence. Clippy has no local counterpart and only runs here.
      - name: Rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      # #1769 — `cargo fmt` / `cargo clippy` only touch the package they are
      # invoked on, never its path dependencies. `table-view-core` holds the
      # db/models/storage/error tree, so without these two steps ~60% of the
      # Rust source would leave both gates while CI stayed green. clippy reads
      # `clippy.toml` from CARGO_MANIFEST_DIR, hence the crate's own copy.
      - name: Rustfmt (table-view-core)
        working-directory: src-tauri/table-view-core
        run: cargo fmt --check

      - name: Clippy (table-view-core)
        working-directory: src-tauri/table-view-core
        run: cargo clippy --all-targets --all-features -- -D warnings

  # 2026-07-25 — this job was briefly split into a 4-way `integration-shard`
  # matrix and reverted after measurement on run 30142745666. Partitioning by
  # test binary made it SLOWER, not faster: the slowest shard (mysql-family)
  # took 1294s against 1028s for the whole undivided job. The bottleneck is not
  # aggregate CPU but the `max-threads = 1` test groups in
  # src-tauri/.config/nextest.toml (`mysql-integration`, `mongo-integration`,
  # pinned for shared-catalog contention #1240/#1244). Inside one job those
  # serialised tests interleave with other binaries across all 4 threads; alone
  # in a shard they run single-threaded with 3 cores idle while every shard
  # re-pays checkout + apt + toolchain + 70s compile + container startup. Do not
  # re-split this job on test-binary lines — fix the serialisation first (give
  # the MySQL/Mongo tests private databases so the groups can lift), and only
  # then revisit. Frontend sharding is unaffected and stays: its suite has no
  # equivalent serial pin.
  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    # 60, not 40: the instrumented `cargo llvm-cov nextest` build plus the
    # MySQL/MSSQL testcontainers do not fit a plain-test budget.
    timeout-minutes: 60

    # Sprint 237 P5+ (2026-05-08) — PG/Mongo 둘 다 GHA service container 로
    # 띄우고 환경변수로 endpoint 를 노출. tests/common/mod.rs 의
    # pg_endpoint/mongo_endpoint helper 가 PGHOST/MONGO_HOST 가 있으면
    # testcontainers 를 띄우지 않고 외부 인스턴스를 그대로 재사용하므로,
    # GHA service 와 testcontainers 가 자연스럽게 swap-in/out 된다.
    # Redis는 별도 GHA service 없이 `redis_integration` testcontainer 가
    # 자체 lifecycle 을 소유한다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: table_view_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d table_view_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mongodb:
        # auth 비활성 default. tests/common/mod.rs 가 user 없는 익명 연결
        # 을 지원하므로 추가 셋팅 불필요.
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        # Retry wrapper (#1293): transient apt mirror failures (e.g.
        # packages.microsoft.com 403) fail the whole setup. Up to 3 attempts
        # with linear backoff. The `Rust Static Analysis` job above runs the
        # same loop.
        run: |
          install_deps() {
            sudo apt-get update && sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          }
          for i in 1 2 3; do
            install_deps && exit 0
            echo "apt install attempt $i failed; retrying in $((i * 10))s" >&2
            sleep "$((i * 10))"
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          # llvm-tools-preview backs `cargo llvm-cov`'s source-based coverage.
          components: llvm-tools-preview

      # cargo-llvm-cov + cargo-nextest back the integration coverage gate below.
      # taiki-e/install-action downloads pinned prebuilt binaries and caches
      # them, so no per-run source build lands on the 40m+ critical path.
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-nextest@0.9.137

      - name: Show disk usage before integration build
        run: |
          df -h /
          du -sh src-tauri/target 2>/dev/null || true
          docker system df || true

      # Do not add SDK deletions or `docker system prune -af` here (measured
      # 2026-07-25): they cost 135s, the runner already reports 86G free of 145G,
      # the prune reclaimed 1.765GB, and it evicts preloaded base images the
      # MySQL/MSSQL/Redis/Oracle testcontainers then re-pull. `apt-get clean` is
      # sub-second. `Show disk usage` above is the signal if pressure returns.
      - name: Free disk headroom before integration build
        run: |
          sudo apt-get clean
          df -h /

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Rust integration coverage gate (audit 2026-07-03 #6) — this is the only
      # thing enforcing the integration coverage floor, and it both runs the
      # tests and grades them, so there is no separate plain `cargo test` step.
      # Thresholds are literals below; nothing else stores them. PG/Mongo reuse
      # the GHA services via PGHOST/MONGO_HOST, MySQL/MSSQL/Redis fall back to
      # their own testcontainers.
      - name: Run integration coverage
        working-directory: src-tauri
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: testuser
          PGPASSWORD: testpass
          PGDATABASE: table_view_test
          MONGO_HOST: localhost
          MONGO_PORT: 27017
        run: |
          cargo llvm-cov nextest --profile push --lib \
            --test storage_integration \
            --test query_integration \
            --test schema_integration \
            --test value_search_integration \
            --test fixture_loading \
            --test mongo_integration \
            --test mysql_integration \
            --test duckdb_file_analytics \
            --test mariadb_ddl_preview \
            --test mssql_connection_routing \
            --test mssql_integration \
            --test oracle_integration \
            --test redis_integration \
            --summary-only \
            --fail-under-lines 80 \
            --fail-under-functions 75 \
            --fail-under-regions 80

  # Job `name:` values are load-bearing: the `pr_to_main` ruleset lists required
  # contexts by name, so renaming one silently un-gates main. That list is live
  # GitHub state — memory/runbook/pr-merge-gates/memory.md tracks it.
  # `Runtime Happy Path` comes from .github/workflows/e2e-smoke.yml.
