name: CI

# Trigger policy:
# - `push` on `main` only: validates what actually landed (post-merge gate).
# - `pull_request`: validates feature branches before they merge and reruns
#   when the GitHub-visible PR body changes.
# This avoids the duplicate run that fires when an open PR's branch is
# pushed (push + pull_request would each schedule a separate workflow on
# the same SHA).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Cancel policy differs by event (audit 2026-07-03):
# - pull_request: cancel in-flight runs when a newer commit arrives — the old
#   run is stale the moment a new commit lands, and fast feedback wins.
# - push to main: do NOT cancel. Let the running post-merge run finish; GitHub
#   keeps at most one running + one pending per group and replaces the pending
#   one, so a burst of N merges converges to first-run + last-run = 2 runs.
#   Cancelling on main could leave zero main runs ever completing during a merge
#   wave, which (a) forfeits the rust-cache main save (only main writes the
#   shared cache) and (b) opens a post-merge verification gap — the background
#   condition behind the 3-week-frozen partial e2e cache. Cost: the tip-of-main
#   signal lags by up to one run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Lightweight change-detection gate (audit 2026-07-03 #5). docs/memory-only
  # PRs (memory-palace ops make these common) were burning the full ~9m CI. This
  # job classifies the change set; heavy jobs below gate on its output.
  # We deliberately do NOT use workflow-level paths-ignore: the branch-protection
  # ruleset requires Frontend Checks / Rust Unit And Storage Tests / Integration
  # Tests (Docker) contexts, and a workflow that never runs leaves those
  # "expected/missing" forever. A job skipped by `if:` still reports a check run
  # that satisfies the required status check (GitHub docs: skipped checks are
  # treated as successful), so job-level skip is the safe lever.
  changes:
    name: Detect Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.detect.outputs.code_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the PR merge-base (three-dot diff) and the main-push
          # `before` sha are both reachable for git diff.
          fetch-depth: 0

      - name: Detect change scope
        id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/hooks/detect-change-scope.sh

  pr-body:
    name: PR Body Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0

      - name: Test PR body checker
        run: bash scripts/hooks/test-check-pr-body.sh

      - name: Validate PR body
        run: node scripts/hooks/check-pr-body.mjs

  doc-size:
    name: Doc Size Advisory (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # advisory (non-blocking) — 현재 회귀 0 (최대 106K chars < 120K cap). threshold 는 추후 ratchet.
    # pre-push 에는 연동하지 않는다 (신규 advisory 정책). block 전환은 분할 정리 후 별도 결정.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check doc size
        run: bash scripts/hooks/check-doc-size.sh

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Fail-closed: skip heavy job ONLY when `changes` succeeded AND classified
    # the set as docs-only. If `changes` itself failed/was cancelled (infra),
    # its outputs are empty and result != 'success', so this runs full — a
    # detection failure must never let unverified code satisfy a required check.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')
    env:
      CARGO_DENY_VERSION: "0.19.9"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache cargo-deny
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install pinned cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}" >/dev/null; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --force
          fi
          cargo deny --version | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}"

      - name: Dependency security summary
        run: bash scripts/hooks/cargo-deny-summary.sh

      # Blocking gate. bans/licenses/sources are properties of *this PR's*
      # dependency set — a banned crate, disallowed license, or untrusted
      # source only appears when someone changes dependencies, so failing the
      # PR is the correct signal. Advisories are decoupled into the
      # `dependency-advisories` job below: a new RUSTSEC advisory is an external
      # event independent of the PR (2026-07-02 incident: one new advisory
      # turned 2 main pushes + 1 unrelated PR red at once).
      - name: Run cargo deny (bans, licenses, sources)
        working-directory: src-tauri
        run: cargo deny check bans licenses sources --hide-inclusion-graph

  dependency-advisories:
    name: Dependency Advisories (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Fail-closed: skip heavy job ONLY when `changes` succeeded AND classified
    # the set as docs-only. If `changes` itself failed/was cancelled (infra),
    # its outputs are empty and result != 'success', so this runs full — a
    # detection failure must never let unverified code satisfy a required check.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')
    # Non-blocking (`continue-on-error`) advisory scan, split out of the
    # blocking gate above. A RUSTSEC advisory is an event about the outside
    # world, not about the code in any given PR, so it must never turn every
    # open PR and main push red at once (2026-07-02 incident). The signal stays
    # visible in the Actions log. Auto-filing an issue on failure is a
    # follow-up, out of scope for this PR.
    continue-on-error: true
    env:
      CARGO_DENY_VERSION: "0.19.9"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache cargo-deny
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install pinned cargo-deny
        run: |
          if ! cargo deny --version 2>/dev/null | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}" >/dev/null; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked --force
          fi
          cargo deny --version | grep -Fx "cargo-deny ${CARGO_DENY_VERSION}"

      - name: Run cargo deny (advisories)
        working-directory: src-tauri
        run: cargo deny check advisories --hide-inclusion-graph

  # The vitest suite (637 files / 6,106 cases) was the `Frontend Checks`
  # bottleneck at 437s of a 532s job. It splits across this matrix; each shard
  # emits a `blob` report carrying its own coverage slice. `Frontend Checks`
  # below merges the blobs and grades the MERGED coverage, so no threshold is
  # weakened by the split — verified locally: a single run and a 2-shard merge
  # of the same scope both reported 225/24539 statements, 219/21747 lines.
  frontend-shard:
    name: Frontend Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Fail-closed, same rule as every other change-gated job below.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')

    strategy:
      # One shard's failure must not cancel the others: the aggregation wants
      # every shard's real result, and a cancelled shard yields no blob at all.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (shard ${{ matrix.shard }}/3)
        # The `--coverage.thresholds.* 0` overrides zero out vite.config.ts's
        # GLOBAL thresholds for this PARTIAL run only — a 1/3 slice can never
        # clear an 85% global floor, and a shard that failed on that would say
        # nothing about the suite. Enforcement is not dropped, only relocated:
        # the `Frontend Checks` merge step below runs with the config's real
        # thresholds over the merged coverage of all three shards, and that job
        # (not these shards) is the name in the `pr_to_main` ruleset.
        # Space-separated form is required — `--coverage.thresholds.lines=0`
        # parses but is silently ignored by vitest 4.1.3.
        run: |
          pnpm exec vitest run \
            --shard=${{ matrix.shard }}/3 \
            --coverage \
            --coverage.thresholds.lines 0 \
            --coverage.thresholds.statements 0 \
            --coverage.thresholds.functions 0 \
            --coverage.thresholds.branches 0 \
            --reporter=blob \
            --outputFile=.vitest-reports/blob-${{ matrix.shard }}.json

      - name: Upload shard blob report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
      - frontend-shard
    # Fail-closed: skip heavy job ONLY when `changes` succeeded AND classified
    # the set as docs-only. If `changes` itself failed/was cancelled (infra),
    # its outputs are empty and result != 'success', so this runs full — a
    # detection failure must never let unverified code satisfy a required check.
    # `always()` additionally keeps this aggregation running when a shard FAILS,
    # so the grading step below turns a red shard into a red required check
    # instead of letting `needs` silently skip it (GitHub counts a skipped
    # required check as successful).
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')

    steps:
      # Grade the matrix BEFORE any setup: with a failed shard there is no blob
      # to merge, and a missing-artifact error would mask the real cause.
      - name: Require test matrix success
        run: |
          if [ "${{ needs.frontend-shard.result }}" != "success" ]; then
            echo "Frontend test matrix result: ${{ needs.frontend-shard.result }}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch coverage ratchet base
        # Force refspec (leading `+`): concurrent main pushes advance origin/main
        # between checkout and this fetch, and a plain shallow fetch rejects the
        # non-fast-forward update. The ratchet only ever compares against the
        # current main tip, so overwriting the local ref is the intended base.
        run: git fetch --no-tags --prune --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Coverage ratchet
        env:
          COVERAGE_RATCHET_REQUIRE_MAIN: "1"
        run: pnpm exec tsx scripts/check-coverage-ratchet.ts

      - name: WASM size budget
        run: pnpm wasm:size

      - name: Lint
        run: pnpm lint

      - name: Download shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .vitest-reports

      - name: Merge shard reports and enforce coverage thresholds
        # No threshold override here on purpose: vite.config.ts's real global
        # floors apply, and this merged report is the one that must clear them.
        # The blob count assertion below is the guard against a silently
        # weakened gate — 2 of 3 blobs would still "pass" a merge, at a
        # coverage number computed from two thirds of the suite.
        run: |
          test "$(ls .vitest-reports/blob-*.json | wc -l)" -eq 3 \
            || { echo "expected 3 shard blobs, got $(ls .vitest-reports/blob-*.json | wc -l)"; exit 1; }
          pnpm exec vitest --mergeReports=.vitest-reports \
            --coverage \
            --coverage.reporter=text-summary

      - name: Build
        run: pnpm build

  frontend-advisory:
    name: Frontend Advisory (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Intentionally NOT change-gated: docs:links is most useful on docs-only
    # PRs, so this job always runs. Non-blocking (continue-on-error) means the
    # extra pnpm install cost never gates a merge.
    # docs:links and contrast:check sat on the blocking frontend job's critical
    # path (9m11s bottleneck) but neither gates a merge. Moved here as a
    # non-blocking job (`continue-on-error`) so the frontend gate keeps only
    # ratchet → wasm:size → lint → test → build.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Documentation links (advisory)
        run: pnpm docs:links
        continue-on-error: true

      # ADR 0031 의 contrast gate 는 advisory 로 강등 (2026-05-17, sprint-384).
      # 72 themes × syntax 12 토큰 = 864 pair 중 다수가 WCAG AA 4.5:1 미달.
      # 시방서 출력 그대로 import 한 결과이고 fix 는 디자인 결정 + 광범위
      # 토큰 수정 필요 (별 sprint). 본 step 이 strict 하면 모든 PR 머지 차단.
      # `continue-on-error` 로 결과를 *경고*로만 표시 — 통계는 actions log 에
      # 남고 ADR 0031 정책은 *future enforcement* (별 sprint) 로 promote.
      - name: Theme contrast (WCAG AA, advisory)
        run: pnpm contrast:check
        continue-on-error: true

  rust:
    name: Rust Unit And Storage Tests
    runs-on: macos-latest
    timeout-minutes: 20
    needs: changes
    # Fail-closed: skip heavy job ONLY when `changes` succeeded AND classified
    # the set as docs-only. If `changes` itself failed/was cancelled (infra),
    # its outputs are empty and result != 'success', so this runs full — a
    # detection failure must never let unverified code satisfy a required check.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # sql-parser-core is a path crate (not a workspace member), so the
          # standalone `--manifest-path src-tauri/sql-parser-core/Cargo.toml`
          # test below compiles into its OWN target dir. Caching only
          # `src-tauri -> target` left it uncached, recompiling every run
          # (audit 2026-07-03). List its target as a second workspace.
          workspaces: |
            src-tauri -> target
            src-tauri/sql-parser-core -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --test storage_integration

      # Sprint 390 (2026-05-17) — sprint-385 review found that the
      # `sql-parser-core` path crate's 31 lib tests and the
      # `parse_sql_backend` integration test (2 tests) were NOT covered
      # by the Rust job above: the previous `cargo test --manifest-path
      # src-tauri/Cargo.toml --lib --test storage_integration` line only
      # runs `table-view`'s lib tests + one named integration target.
      # Wire them in as separate steps so a regression in either set
      # fails CI. Steps run serially with default `if: success()` — a
      # failure in the table-view lib tests short-circuits the rest,
      # which is the desired blast-radius behavior (fix upstream first).
      - name: Run sql-parser-core unit tests
        run: cargo test --manifest-path src-tauri/sql-parser-core/Cargo.toml --lib
      - name: Run parse_sql_backend integration test
        run: cargo test --manifest-path src-tauri/Cargo.toml --test parse_sql_backend

  rust-static:
    name: Rust Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Fail-closed: skip heavy job ONLY when `changes` succeeded AND classified
    # the set as docs-only. If `changes` itself failed/was cancelled (infra),
    # its outputs are empty and result != 'success', so this runs full — a
    # detection failure must never let unverified code satisfy a required check.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # clippy --all-features pulls the full Tauri feature graph, which needs
      # the WebKitGTK/GTK system libraries to compile on Linux. Mirrors the
      # integration-tests job's apt step.
      - name: Install Tauri Linux dependencies
        # Retry wrapper: transient apt mirror failures (e.g. packages.microsoft.com
        # 403) fail the whole setup. Up to 3 attempts with linear backoff.
        # Mirrors the e2e-smoke workflow's install_deps retry loop (#1293).
        run: |
          install_deps() {
            sudo apt-get update && sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          }
          for i in 1 2 3; do
            install_deps && exit 0
            echo "apt install attempt $i failed; retrying in $((i * 10))s" >&2
            sleep "$((i * 10))"
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Mirror lefthook.yml pre-commit rust-format / rust-clippy exactly so a
      # local pre-commit pass and CI agree. lefthook runs only
      # `cd src-tauri && cargo fmt --check` / `cargo clippy --all-targets
      # --all-features -- -D warnings`; it does not invoke the sql-parser-core
      # path crate as a separate command, so CI mirrors just these two.
      - name: Rustfmt (mirror lefthook rust-format)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy (mirror lefthook rust-clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

  # 2026-07-25 — split out of the former single `Integration Tests (Docker)`
  # job. Measured on run 30140302749: that job spent 70s compiling and 689s
  # running 2194 tests across 14 binaries, i.e. 89% of the step was test
  # execution, so partitioning by test binary converts almost all of it into
  # wall-clock savings. Each shard pays the ~70s compile again; that is the
  # accepted trade. Grouping rules: `mysql_integration` and `mongo_integration`
  # are pinned to `max-threads = 1` in src-tauri/.config/nextest.toml (shared
  # catalog contention, #1240/#1244), so they are placed in SEPARATE shards
  # rather than serialising behind each other; `oracle_integration` trips the
  # 60s SLOW threshold and gets grouped with the other enterprise drivers.
  integration-shard:
    name: Integration Shard (${{ matrix.shard.key }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    # Fail-closed: skip heavy job ONLY when `changes` succeeded AND classified
    # the set as docs-only. If `changes` itself failed/was cancelled (infra),
    # its outputs are empty and result != 'success', so this runs full — a
    # detection failure must never let unverified code satisfy a required check.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')

    strategy:
      # A red shard must not cancel its siblings: the aggregation grades every
      # shard's real result, and a cancelled shard uploads no profraw at all.
      fail-fast: false
      matrix:
        shard:
          - key: core
            targets: >-
              --lib
              --test storage_integration
              --test query_integration
              --test schema_integration
              --test value_search_integration
              --test fixture_loading
          - key: document-kv
            targets: >-
              --test mongo_integration
              --test redis_integration
              --test duckdb_file_analytics
          - key: mysql-family
            targets: >-
              --test mysql_integration
              --test mariadb_ddl_preview
          - key: enterprise
            targets: >-
              --test mssql_connection_routing
              --test mssql_integration
              --test oracle_integration

    # Sprint 237 P5+ (2026-05-08) — PG/Mongo 둘 다 GHA service container 로
    # 띄우고 환경변수로 endpoint 를 노출. tests/common/mod.rs 의
    # pg_endpoint/mongo_endpoint helper 가 PGHOST/MONGO_HOST 가 있으면
    # testcontainers 를 띄우지 않고 외부 인스턴스를 그대로 재사용하므로,
    # GHA service 와 testcontainers 가 자연스럽게 swap-in/out 된다.
    # Redis는 별도 GHA service 없이 `redis_integration` testcontainer 가
    # 자체 lifecycle 을 소유한다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: table_view_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d table_view_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mongodb:
        # auth 비활성 default. tests/common/mod.rs 가 user 없는 익명 연결
        # 을 지원하므로 추가 셋팅 불필요.
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        # Retry wrapper: transient apt mirror failures (e.g. packages.microsoft.com
        # 403) fail the whole setup. Up to 3 attempts with linear backoff.
        # Mirrors the e2e-smoke workflow's install_deps retry loop (#1293).
        run: |
          install_deps() {
            sudo apt-get update && sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          }
          for i in 1 2 3; do
            install_deps && exit 0
            echo "apt install attempt $i failed; retrying in $((i * 10))s" >&2
            sleep "$((i * 10))"
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          # llvm-tools-preview backs `cargo llvm-cov`'s source-based coverage.
          components: llvm-tools-preview

      # cargo-llvm-cov + cargo-nextest back the promoted integration coverage
      # gate below. taiki-e/install-action downloads pinned prebuilt binaries
      # (versions match the local pre-push toolchain from scripts/setup.sh) and
      # caches them, so no per-run source build lands on the 40m+ critical path.
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-nextest@0.9.137

      - name: Show disk usage before integration build
        run: |
          df -h /
          du -sh src-tauri/target 2>/dev/null || true
          docker system df || true

      # 2026-07-25 — this step used to also `rm -rf /usr/local/lib/android
      # /usr/share/dotnet /opt/ghc` and `docker system prune -af`, costing 135s
      # (~13% of the job). The measured numbers say it bought nothing: the
      # runner reports 145G total / 86G AVAILABLE before any cleanup, and the
      # prune reclaimed 1.765GB of that. Deleting ~15G of preinstalled SDKs to
      # go from 86G to 103G free is 130s spent on headroom the instrumented
      # build never needed — and the prune additionally evicts preloaded base
      # images that the MySQL/MSSQL/Redis/Oracle testcontainers then re-pull.
      # `apt-get clean` stays (sub-second). If disk pressure ever returns, the
      # `Show disk usage` step above is the signal to restore the deletions.
      - name: Free disk headroom before integration build
        run: |
          sudo apt-get clean
          df -h /

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Rust integration coverage gate (audit 2026-07-03 #6). Promoted here from
      # the local pre-push rust route so a required *remote* check — not just the
      # dev machine's hook — owns the integration coverage floor. Runs the exact
      # push nextest profile + llvm-cov thresholds (lines 80 / functions 75 /
      # regions 80), ratchet-locked in scripts/coverage-ratchet-targets.json
      # (`rust.pre_push.integration`; check-coverage-ratchet.ts reads the
      # thresholds from this step). This coverage run REPLACES the former plain
      # `cargo test` step (no reason to run the same tests twice): it adds the
      # nine push-profile integration binaries + --lib, and keeps
      # redis_integration — which the plain test ran and the old pre-push
      # coverage command omitted — so no test signal is lost. PG/Mongo reuse the
      # GHA services via PGHOST/MONGO_HOST; MySQL/MSSQL/Redis fall back to their
      # self-owned testcontainers (Docker is present on the runner). Instrumented
      # build + extra testcontainers cost more wall-clock than the old plain
      # test — the accepted promotion trade-off (timeout raised 40 -> 60m).
      - name: Run instrumented tests (${{ matrix.shard.key }})
        working-directory: src-tauri
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: testuser
          PGPASSWORD: testpass
          PGDATABASE: table_view_test
          MONGO_HOST: localhost
          MONGO_PORT: 27017
        # `--no-report` keeps the raw .profraw and skips report generation —
        # a single shard's coverage is meaningless on its own. The thresholds
        # are applied once, by `Integration Tests (Docker)`, over every shard's
        # profraw merged together.
        run: |
          cargo llvm-cov nextest --profile push --no-report ${{ matrix.shard.targets }}

      # Uploaded per shard and renamed on download: cargo-llvm-cov names profraw
      # files `<crate>-%p-%m.profraw` where %p is the PID. Distinct runners pick
      # PIDs independently, so a flat `merge-multiple: true` download could
      # silently overwrite one shard's file with another's — losing coverage and
      # under-reporting the total, the exact failure this gate exists to catch.
      - name: Upload raw coverage (${{ matrix.shard.key }})
        uses: actions/upload-artifact@v4
        with:
          name: llvm-cov-profraw-${{ matrix.shard.key }}
          path: src-tauri/target/llvm-cov-target/*.profraw
          retention-days: 1
          if-no-files-found: error

  integration-tests:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
      - integration-shard
    # Fail-closed on `changes` exactly like the shards, plus `always()` so a
    # FAILED shard still reaches the grading step below — a skipped required
    # check counts as successful on GitHub, so silent skip is not an option.
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code_changed == 'true')

    steps:
      - name: Require integration matrix success
        run: |
          if [ "${{ needs.integration-shard.result }}" != "success" ]; then
            echo "Integration matrix result: ${{ needs.integration-shard.result }}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          install_deps() {
            sudo apt-get update && sudo apt-get install -y \
              libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          }
          for i in 1 2 3; do
            install_deps && exit 0
            echo "apt install attempt $i failed; retrying in $((i * 10))s" >&2
            sleep "$((i * 10))"
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-nextest@0.9.137

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: llvm-cov-profraw-*
          path: profraw-shards

      # Per-shard subdirectories are flattened here with a shard-name prefix so
      # identical `<crate>-<pid>-<hash>.profraw` names from different runners
      # cannot clobber each other. The count assertion is the guard: a merge
      # that silently lost a shard would report a LOWER total and could still
      # clear 80%, turning the gate into a rubber stamp.
      - name: Collect profraw for merge
        run: |
          mkdir -p src-tauri/target/llvm-cov-target
          for dir in profraw-shards/llvm-cov-profraw-*; do
            key="$(basename "$dir" | sed 's/^llvm-cov-profraw-//')"
            for f in "$dir"/*.profraw; do
              cp "$f" "src-tauri/target/llvm-cov-target/${key}-$(basename "$f")"
            done
          done
          found="$(ls src-tauri/target/llvm-cov-target/*.profraw | wc -l)"
          shards="$(ls -d profraw-shards/llvm-cov-profraw-* | wc -l)"
          echo "collected $found profraw files from $shards shards"
          test "$shards" -eq 4 || { echo "expected 4 shards, got $shards"; exit 1; }
          test "$found" -gt 0 || { echo "no profraw collected"; exit 1; }

      # Rust integration coverage gate (audit 2026-07-03 #6). Promoted here from
      # the local pre-push rust route so a required *remote* check — not just the
      # dev machine's hook — owns the integration coverage floor. Thresholds
      # (lines 80 / functions 75 / regions 80) are ratchet-locked in
      # scripts/coverage-ratchet-targets.json (`rust.pre_push.integration`;
      # check-coverage-ratchet.ts reads them out of this step's text, which is
      # why the `cargo llvm-cov nextest --profile push` prefix and the
      # `--fail-under-*` flags must stay in one command).
      #
      # `--no-run` rebuilds the instrumented binaries (needed to map profraw
      # back to source) but runs no tests, then reports over the profraw the
      # shards produced. It implies no-clean — cargo-llvm-cov rejects the two
      # together — so the collected shard data survives.
      - name: Merge shard coverage and enforce thresholds
        working-directory: src-tauri
        run: |
          cargo llvm-cov nextest --profile push --no-run \
            --summary-only \
            --fail-under-lines 80 \
            --fail-under-functions 75 \
            --fail-under-regions 80

  # Runtime E2E smoke lives in .github/workflows/e2e-smoke.yml as a
  # blocking remote check on pull requests and main. This workflow keeps the
  # non-runtime correctness gates.
  #   Blocking: dependency-security (bans/licenses/sources), frontend
  #   (ratchet → wasm:size → lint → merge shard coverage → build), rust-static
  #   (fmt + clippy, mirrors lefthook), rust unit/storage tests, integration
  #   coverage (`cargo llvm-cov nextest --profile push`, thresholds 80/75/80 —
  #   promoted from the local pre-push rust route, audit 2026-07-03 #6).
  #   Non-blocking (advisory): doc-size, dependency-advisories (RUSTSEC),
  #   frontend-advisory (docs:links + WCAG contrast).
  # `Frontend Checks` and `Integration Tests (Docker)` are AGGREGATION jobs
  # (2026-07-25): the work runs in the `frontend-shard` / `integration-shard`
  # matrices and these two merge the shards' coverage and apply the thresholds.
  # Their `name:` values are load-bearing — the `pr_to_main` ruleset lists the
  # required contexts by name, so renaming either job silently un-gates main
  # (a context that never reports is not a context that fails). Same reason the
  # e2e workflow keeps a bare `Runtime Happy Path` aggregation over its matrix.
  # The blocking jobs + dependency-advisories gate on `changes` with a
  # fail-closed `if:` (skip only when `changes` succeeded AND said docs-only;
  # any detection failure runs full), so docs/memory/*.md-only changes skip them
  # while a broken detector never satisfies a required check by skip. pr-body,
  # doc-size, and frontend-advisory always run (cheap / docs:links matters most
  # on docs PRs).
