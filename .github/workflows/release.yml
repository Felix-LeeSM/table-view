name: Release

# Trigger policy:
# - tag push (`v*.*.*`): the actual release pipeline. Tag SHA's tauri.conf.json
#   version must match the tag (e.g. tag `v0.2.0` ↔ "version": "0.2.0"). Builds
#   required bundles for macOS arm64 and Windows x86_64, plus the Linux x64
#   automation bundle, and attaches them to
#   a *draft* GitHub Release named after the tag — the maintainer reviews and
#   publishes manually so an accidental tag push doesn't ship to users.
# - `workflow_dispatch`: manual trigger from the Actions UI for dry-runs. Still
#   produces a draft release using the dispatched ref's commit SHA as the tag,
#   so you can rehearse the pipeline without pushing a real version tag. #1439
#   P3-12: the dispatch draft is also flagged `prerelease: true`, so that even
#   if a maintainer accidentally publishes it, GitHub's `/releases/latest`
#   (which excludes drafts *and* prereleases) can never resolve to it — the
#   updater endpoint `releases/latest/download/latest.json` therefore cannot
#   serve a dry-run to clients. The dry-run still signs and runs every gate, so
#   it remains a faithful rehearsal.
# - `release` (`published`): the maintainer's manual publish click, and nothing
#   else — #2454. Only `update-homebrew-tap` runs on it; `build` and the two
#   verify jobs are guarded off with `github.event_name != 'release'` so that
#   publishing a draft cannot rebuild and re-upload the very bundles the
#   maintainer just reviewed. Those three guards are no-ops on the two triggers
#   above, where `github.event_name` is `push` or `workflow_dispatch`.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  release:
    types: [published]

# Two release runs on the same tag would race against the same draft release;
# cancel the older one.
#
# The `release: published` run shares this group with its tag's build run —
# `github.ref` is the same `refs/tags/vX.Y.Z` for both. Publishing while the
# build run is still going therefore leaves the tap job PENDING until that run
# ends (up to 60 min), which is harmless and arguably right: the tap should not
# be bumped while assets are still uploading. Accepted ceiling, not an
# oversight — splitting the group by `github.event_name` would rewrite the key
# for the existing triggers too, and the manual fallback in
# docs/contributor-guide/release/homebrew-cask.md covers the rare case where a
# re-push of the same tag cancels a pending tap run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Bundle (${{ matrix.label }})
    # Never on the `release: published` event — that event fires AFTER these
    # bundles are public, and rebuilding would re-upload over assets users are
    # already downloading. Only `update-homebrew-tap` belongs to that trigger.
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            cxxflags: ""
          # Pinned to windows-2022 (VS17 / MSVC 14.4x): windows-latest ships VS18
          # (MSVC 14.51), where DuckDB's vendored fmt references
          # stdext::checked_array_iterator and fails with C2653 even under
          # /std:c++17. Matches platform-smoke-canary.yml. Lift the pin only after
          # DuckDB's vendored fmt builds clean on MSVC 14.51.
          - label: Windows x86_64
            platform: windows-2022
            target: x86_64-pc-windows-msvc
            args: ""
            cxxflags: "/std:c++17"
          - label: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            cxxflags: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # UNGUARDED (#1431) — nothing checks the tag against the checked-out
      # tauri.conf.json version here. auto-tag-release.yml checks it before
      # *creating* a tag, so the hole is the manual `git push origin vX.Y.Z`
      # path: it publishes the checked-out bundle under a mismatched tag.

      # Linux Tauri bundles depend on webkit2gtk + librsvg + patchelf. macOS &
      # Windows runners come with everything Tauri needs preinstalled (libwebview2
      # on Windows, WKWebView on macOS).
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Rust target dir caches across runs of the same matrix leg. Keyed on
      # OS+target so each platform keeps an isolated target tree.
      # restore-only (`save-if: false`, matches platform-smoke-canary.yml):
      # release runs fire on tag refs, and GitHub cache scope lets a tag run
      # restore only its own ref + the default branch — never a *prior* tag's
      # cache. So a save here can never be reused by a future release and just
      # burns quota (audit 2026-07-03: v0.3.1/v0.3.2 tags held 3.5GB of dead
      # cache toward the 10GB cap). Restore-only still lets a re-run of the
      # *same* tag reuse the default-branch cache.
      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          shared-key: release
          save-if: false

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      # tauri-action handles: `pnpm tauri build --target …`, parsing the bundle
      # artifacts, creating/updating a GitHub Release, and uploading every
      # bundle output as a release asset. We rely on the .icon Liquid Glass
      # artifacts already committed under src-tauri/icons/Compiled/ so the
      # macOS runner doesn't need actool at release time.
      - name: Build + upload to draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CXXFLAGS: ${{ matrix.cxxflags }}
          # #1400 — auto-update. With `createUpdaterArtifacts: true` in
          # tauri.conf.json, tauri-action signs each updater bundle with the
          # minisign key and uploads the aggregated `latest.json` manifest to
          # the same draft release, which the app fetches from the
          # `releases/latest/download/latest.json` endpoint.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.sha) }}
          releaseName: "Table View ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"
          releaseBody: |
            Multi-platform release bundles produced by `.github/workflows/release.yml`.

            **Install**

            - **macOS**: download the Apple Silicon `.dmg`.
              Unsigned — on first launch right-click → Open, or run
              `xattr -d com.apple.quarantine "/Applications/Table View.app"`.
            - **Windows**: run the `.msi` installer. Unsigned — SmartScreen may
              warn; click "More info" → "Run anyway".
            - **Linux**: `.deb`, `.rpm`, or `.AppImage` — pick the one matching
              your distro.

            **Verify**

            Each bundle has a sibling `.sha256` file. After downloading both:

            ```sh
            # macOS / Linux
            shasum -a 256 -c <file>.dmg.sha256
            # Windows (PowerShell)
            (Get-FileHash <file>.msi -Algorithm SHA256).Hash -eq (Get-Content <file>.msi.sha256).Split()[0]
            ```

            See the commit log for changes.
          releaseDraft: true
          # #1439 P3-12 — a real tag release is a normal release; a
          # workflow_dispatch dry-run is marked prerelease so it is excluded from
          # `/releases/latest` (and thus the updater's `latest.json` endpoint)
          # even if it is published by mistake.
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}

      # Regression guard: confirm the macOS bundle carries a proper ad-hoc
      # signature (Sealed Resources). Without it Gatekeeper trashes the app as
      # "damaged" — the bundle ends up only linker-signed (flags 0x20002), which
      # spctl rejects with "code has no resources but signature indicates they
      # must be present". Catch a Tauri signing regression here, not in a user's
      # /Applications.
      - name: Verify macOS bundle signature
        if: matrix.platform == 'macos-14'
        shell: bash
        run: |
          set -e
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Table View.app"
          [ -d "$APP" ] || { echo "FAIL: $APP not found"; exit 1; }
          codesign -dv --verbose=4 "$APP" 2>/tmp/cs.txt || { echo "FAIL: codesign"; cat /tmp/cs.txt; exit 1; }
          grep -q "Sealed Resources version=2" /tmp/cs.txt || { echo "FAIL: no Sealed Resources — bundle not signed, would be 'damaged'"; cat /tmp/cs.txt; exit 1; }
          echo "OK: macOS bundle carries Sealed Resources (proper ad-hoc signature)"

      # UNGUARDED (#1430) — nothing verifies the produced `.sig` files against
      # the pubkey committed in src-tauri/tauri.conf.json. If the signing key and
      # that pubkey drift (e.g. a rotation updates only one side), every client's
      # auto-update fails silently: updater errors are DEV-log-only and there is
      # no telemetry (ADR 0036), so nothing else catches it.

      # tauri-action exposes `artifactPaths` — the JSON array of bundles it just
      # uploaded as release assets. We hash each one with sha256 and upload the
      # sidecar `.sha256` file (single-line `<hash>  <filename>` so the standard
      # `shasum -a 256 -c …` checksum verifier works).
      #
      # #2307 — `artifactPaths` carries RUNNER-LOCAL paths, and the name an asset
      # is published under is not that name. Two renames sit in between: GitHub
      # rewrites spaces to dots, and tauri-action gives the macOS updater tarball
      # an arch suffix. v0.7.1 shows both — asset `Table.View_aarch64.app.tar.gz`
      # got a sidecar published as `Table.View.app.tar.gz.sha256`, pairing with
      # nothing, and every sidecar named its file `Table View_…` with a space, so
      # the `shasum -a 256 -c` the release body tells users to run failed with
      # "No such file or directory" on every asset in the release. So the name is
      # read back off the release rather than derived from `$f`.
      #
      # #2207 — `shell: bash` on Windows is Git Bash, which does ship `shasum`
      # and `jq`, but tauri-action hands it BACKSLASH paths
      # (`D:\a\table-view\...\Table View_0.7.1_x64_en-US.msi`) that Git Bash
      # cannot stat. The previous body opened with `[ -f "$f" ] || continue`, so
      # every Windows entry was skipped and the step still ended green: v0.7.0
      # and v0.7.1 both published .msi/.exe bundles with no checksum while the
      # release body told Windows users to verify against a `.sha256` that was
      # never there. What keeps that shape from coming back: `cygpath -u`
      # converts the path; an entry that resolves to neither a file nor a
      # directory fails the step instead of being skipped; an artifactPaths
      # array that carried no entry is red; and a run where EVERY entry was
      # skipped is red. Directory entries are the legitimate skip — the macOS
      # `.app` bundle is one — and each one is logged.
      #
      # The `run:` body carries no `${{ }}` expressions on purpose: the
      # regression suite (scripts/release/checksum-sidecars.test.sh) extracts it
      # from this file and executes it, so anything the runner would have to
      # substitute first would reach the suite as literal text. `ARTIFACT_PATHS`
      # comes in through `env:` for the same reason, which also keeps a path
      # containing a quote from being pasted into the script body.
      - name: Upload SHA256 checksums
        if: steps.tauri.outputs.artifactPaths != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.sha) }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail

          # Git Bash cannot stat `D:\a\...`; `cygpath -u` turns it into
          # `/d/a/...`. It ships with Git for Windows and is absent from the
          # macOS/Linux runners, which already report POSIX paths, so the
          # absence of the binary is the "nothing to convert" case.
          to_posix() {
            if command -v cygpath >/dev/null 2>&1; then
              cygpath -u "$1"
            else
              printf '%s' "$1"
            fi
          }

          # The join key is the content digest, not the name. Mirroring either
          # rename here would just move the divergence — the next change on
          # either side would go stale in this file instead of in the sidecar.
          # `gh release view` resolves a draft by tag the same way `gh release
          # upload` below already does.
          assets="$(gh release view "$TAG" --json assets)"

          # `done < <(...)` and not `jq … | while`: a pipe would put the loop in
          # a subshell and the counters below would come back zero however many
          # bundles were hashed.
          entries=0
          hashed=0
          while IFS= read -r raw; do
            entries=$((entries + 1))
            f="$(to_posix "$raw")"
            if [ -d "$f" ]; then
              echo "::notice::no sidecar for a directory bundle: $raw"
              continue
            fi
            if [ ! -f "$f" ]; then
              echo "::error::artifactPaths entry resolves to nothing: $raw (read as '$f'). Refusing to end green with a bundle that has no checksum." >&2
              exit 1
            fi
            sum="$(shasum -a 256 "$f" | cut -d' ' -f1)"
            name="$(printf '%s' "$assets" | jq -r --arg d "sha256:$sum" '[.assets[] | select(.digest == $d) | .name] | if length == 1 then .[0] else "" end')"
            if [ -z "$name" ]; then
              echo "::error::no single $TAG asset carries digest sha256:$sum ($raw). Refusing to upload a sidecar under a name that pairs with nothing." >&2
              exit 1
            fi
            # Both the sidecar's own name and the filename column inside it are
            # the published name: `shasum -c` runs in the directory the user
            # downloaded into, where that is what the file is called.
            printf '%s  %s\n' "$sum" "$name" > "$(dirname "$f")/$name.sha256"
            gh release upload "$TAG" "$(dirname "$f")/$name.sha256" --clobber
            hashed=$((hashed + 1))
          done < <(printf '%s' "$ARTIFACT_PATHS" | jq -r '.[]')

          if [ "$entries" -eq 0 ]; then
            echo "::error::artifactPaths carried no entries, so nothing was hashed. Do not publish this draft — its bundles have no checksums." >&2
            exit 1
          fi
          if [ "$hashed" -eq 0 ]; then
            echo "::error::every artifactPaths entry was skipped, so no .sha256 was uploaded for $TAG." >&2
            exit 1
          fi
          echo "::notice::uploaded $hashed .sha256 sidecar(s) for $TAG"

  # #1429 — why the manifest matters. The build matrix runs with
  # `fail-fast: false`, and tauri-action merges each leg's updater entry into
  # the draft release's latest.json via read-merge-write. A failed leg (v0.3.1:
  # the Windows leg) — or a lost concurrent merge — leaves that platform's key
  # out of the manifest; publishing it makes `check()` on that OS report
  # "up to date" forever, swallowed silently client-side (ADR 0036, no
  # telemetry). This job proves only that a manifest exists. Checking that it
  # carries one key per matrix platform is a manual step in
  # docs/contributor-guide/release/versioning-and-artifacts.md.
  verify-latest-json:
    name: Verify latest.json is present
    needs: build
    # Run even when a build leg failed — a dead leg is exactly the case that can
    # leave the draft with no manifest at all. `always()` also survives a
    # SKIPPED `build`, so the event guard has to be spelled out here too or this
    # job would fire on `release: published` with no draft of its own to read.
    if: always() && github.event_name != 'release'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Fails if the draft has no latest.json at all (e.g. every leg died
      # before upload). An incomplete manifest downloads fine and passes.
      - name: Download merged latest.json from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.sha) }}
        run: gh release download "$TAG" --pattern latest.json --output latest.json

      # UNGUARDED — nothing asserts that the merged updater manifest carries one
      # platform key per build-matrix leg. The download above fails closed when
      # the draft has no latest.json at all, but an INCOMPLETE manifest (a leg
      # that died after upload) publishes unnoticed.

  # #2168 — the tag exists before its CI verdict does. auto-tag-release.yml fires
  # on the version-bump merge and pushes `vX.Y.Z` right away, concurrently with
  # the main-push CI on that same merge commit, so until this job nothing in the
  # pipeline ever read the tagged SHA's checks at all. Note the narrower claim:
  # this job reports a verdict, it does not prove the SHA green — it counts
  # neither its own run's checks nor any name ending in `(non-blocking)`, per
  # `relevant()` below. Meanwhile
  # docs/contributor-guide/release/versioning-and-artifacts.md promises the tag
  # points at a SHA that passed the Pre-Release Verification Gate. At v0.7.0 the
  # promise happened to hold — all 18 checks on 39019c3c were success — but a
  # human had to query the API to learn that; the pipeline never said so.
  #
  # The gate sits at the *draft*, not at the tag (owner decision, 2026-08-05, on
  # #2168). Making auto-tag wait for CI would delay the tag by a full CI run and,
  # worse, a missing tag means release.yml never fires and the bundles have to be
  # produced by hand. What actually needs protecting is the moment artifacts
  # reach users, and that moment is the maintainer's manual publish click. So the
  # tag stays instant, the bundles still build, and a tag SHA carrying a red
  # check this job counts ends the release run red — the signal lands next to
  # the Publish button. A tag SHA whose only red check is an advisory one
  # (`(non-blocking)` suffix) does not, by design.
  #
  # This job does not block the draft from being created: tauri-action makes the
  # draft at the START of `build` (`releaseDraft: true` above), so there is no
  # "create the draft only after verification" position in this pipeline.
  verify-tag-ci:
    name: Verify tag SHA CI is green
    needs: build
    # Report the tagged SHA's verdict even when a build leg died. A dead leg is
    # evidence about the runner, not about the commit, and the maintainer still
    # has a draft in front of them either way. Same reason as the job above for
    # the event guard: `always()` survives a SKIPPED `build`, and this verdict
    # is for the maintainer standing in front of the Publish button — after the
    # click there is nothing left for it to gate.
    if: always() && github.event_name != 'release'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Narrower than the workflow-level `contents: write` — this job only reads.
    permissions:
      checks: read
      contents: read
    steps:
      - name: Fail the release run when the tagged SHA has failing non-advisory checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job runs after `build` (up to 60 min), by which point the
          # main-push CI on the same commit has long finished — the wait budget
          # is the safety net for the `always()` path where a build leg dies
          # early. Overridable so the regression suite can drive the poll
          # without sleeping; the workflow pins the real values here.
          TAG_CI_WAIT_SECONDS: "900"
          TAG_CI_POLL_SECONDS: "30"
        run: |
          set -uo pipefail

          # One row per check run on this commit: name, status, conclusion, url.
          # The projection stays dumb on purpose — every decision below is made
          # in shell so the regression suite can drive it with a stubbed `gh`.
          fetch() {
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "pending"), (.details_url // "")] | @tsv'
          }

          # Two kinds of row are dropped.
          #
          # (1) This release run's own check runs. They are in progress by
          #     definition — including the one you are reading — so counting
          #     them would wait on ourselves until the budget expires.
          # (2) Names ending in `(non-blocking)`. The case that suffix was made
          #     for is ci.yml's `Dependency Advisories (non-blocking)`: a RUSTSEC
          #     advisory is an event about the outside world, not about this
          #     commit, and ci.yml marks that job `continue-on-error: true` so a
          #     single advisory cannot turn every open PR and main push red at
          #     once (2026-07-02 incident). Blocking a release on it would
          #     reintroduce exactly that. Matching the suffix rather than listing
          #     job names also covers a future advisory job the day it is named.
          #
          #     The exclusion is name-based, and since #2174 the name is backed
          #     by behaviour: `scripts/check-non-blocking-jobs.sh` turns CI red
          #     if a job carries the suffix without `continue-on-error: true`.
          #
          #     That does NOT reduce this filter to a no-op. A failing
          #     `continue-on-error: true` job still writes
          #     `conclusion: failure` to its OWN check run — the flag spares the
          #     workflow run, not the check run. Measured on a throwaway branch
          #     whose only step was `exit 1`:
          #     https://github.com/Felix-LeeSM/table-view/actions/runs/31017294699
          #     (job `failure`, run `success`) against the control
          #     https://github.com/Felix-LeeSM/table-view/actions/runs/31017295684
          #     (both `failure`). Mind the direction of that claim. `relevant()`
          #     below reads the name and the details URL only — never the
          #     conclusion — so it drops these rows whatever colour they are:
          #     on a green commit it drops a GREEN
          #     `Dependency Advisories (non-blocking)` row, and it drops every
          #     row belonging to this release run. The true, narrower statement
          #     is that a dropped row which IS red is genuinely red, the flag
          #     having spared the workflow run and not the check run. So it is
          #     this filter — not the flag — that keeps one RUSTSEC advisory
          #     from blocking every release, and a green result here is still
          #     not the same claim as "the commit is green";
          #     docs/contributor-guide/release/versioning-and-artifacts.md tells
          #     the maintainer to read the commit's own check list before
          #     publishing rather than trust this job alone.
          relevant() {
            awk -F'\t' -v self="/actions/runs/${GITHUB_RUN_ID}/" \
              'NF && index($4, self) == 0 && $1 !~ /\(non-blocking\)$/ { print $1 "\t" $2 "\t" $3 }'
          }

          deadline=$((SECONDS + TAG_CI_WAIT_SECONDS))
          while :; do
            if ! raw="$(fetch 2>&1)"; then
              echo "::error::Could not read check runs for ${GITHUB_SHA}. An unreadable verdict is not a pass — treat this draft as unverified and check the commit by hand before publishing." >&2
              printf '%s\n' "$raw" >&2
              exit 1
            fi
            rows="$(printf '%s\n' "$raw" | relevant)"

            running="$(printf '%s\n' "$rows" | awk -F'\t' 'NF && $2 != "completed"')"
            [ -z "$running" ] && break

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Checks on ${GITHUB_SHA} were still running after ${TAG_CI_WAIT_SECONDS}s, so this release run cannot vouch for the commit. Still running:" >&2
              printf '%s\n' "$running" >&2
              exit 1
            fi
            sleep "$TAG_CI_POLL_SECONDS"
          done

          if [ -z "$rows" ]; then
            echo "::error::${GITHUB_SHA} carries no check runs outside this release run. The tag points at a commit CI never verified — do not publish this draft." >&2
            exit 1
          fi

          # success / neutral / skipped are the conclusions that mean "did not
          # fail". Everything else (failure, timed_out, cancelled,
          # action_required, startup_failure, stale) is red.
          failed="$(printf '%s\n' "$rows" | awk -F'\t' 'NF && $3 != "success" && $3 != "neutral" && $3 != "skipped"')"
          if [ -n "$failed" ]; then
            echo "::error::${GITHUB_SHA} has failing checks. Do NOT publish this draft — publishing it ships these bundles to every installed client through the updater:" >&2
            printf '%s\n' "$failed" >&2
            exit 1
          fi

          echo "::notice::${GITHUB_SHA}: $(printf '%s\n' "$rows" | grep -c .) check runs green. The draft still needs the manual Post-Release Verification in docs/contributor-guide/release/versioning-and-artifacts.md before publishing."

  # #2454 — the Homebrew cask sat at 0.4.1 while v0.7.1 shipped, three versions
  # behind, because bumping the tap was a manual step nobody performed after
  # v0.5.0. `brew install --cask` users were stranded on 0.4.1 straight through
  # the v0.7.0 saved-connection data-loss bug that v0.7.1 fixed.
  #
  # Why `release: published` and not the tag push. This repo tags into a DRAFT
  # and a maintainer publishes by hand (trigger policy at the top of this file).
  # On a tag-push trigger the tap would move BEFORE a human looked at the draft,
  # so a tag that gets pulled would still have shipped its version to every
  # `brew upgrade`. `published` is the first moment the artifacts are public.
  #
  # This job cannot break a release. The event that starts it only exists after
  # the bundles are already published, and it lands in its own workflow run —
  # the build/sign/draft path is a different run that never waits on this one.
  # A red job here means the tap is stale, and
  # docs/contributor-guide/release/homebrew-cask.md carries the manual fallback.
  #
  # Not run for prereleases. A `workflow_dispatch` dry-run leaves a draft
  # flagged `prerelease: true`; an unpublished draft fires no event at all, but
  # the head comment above is explicit that a maintainer might publish one by
  # mistake, and that is the case this condition covers. The tag-shape check in
  # the step below is the second layer — a dry-run draft is tagged
  # `manual-<sha>`, which names no version.
  update-homebrew-tap:
    name: Update Homebrew tap cask
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # Narrower than the workflow-level `contents: write`. The write target is
    # another repository and it is reached with HOMEBREW_TAP_TOKEN; nothing in
    # this job writes to this one.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # HOMEBREW_TAP_TOKEN and not RELEASE_PAT: RELEASE_PAT carries
      # `contents: write` on THIS repo (auto-tag-release.yml pushes tags with
      # it), and handing that to a step whose only write target is the tap would
      # widen the blast radius of a leak for no gain. HOMEBREW_TAP_TOKEN exists
      # for the tap and is scoped to it.
      - name: Update the tap cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          TAP_REPO: Felix-LeeSM/homebrew-table-view
        run: |
          set -euo pipefail

          # An unset secret arrives as the empty string, and the tap is public,
          # so `git clone` with an empty credential SUCCEEDS and the failure
          # would not surface until `git push` returns 403 several steps later.
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is empty, so nothing can be pushed to $TAP_REPO. Bump the cask by hand — docs/contributor-guide/release/homebrew-cask.md." >&2
            exit 1
          fi

          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::tag '$TAG' is not vX.Y.Z, so it names no version to publish. A workflow_dispatch dry-run draft is tagged manual-<sha>; publishing one of those is the case this refuses." >&2
              exit 1
              ;;
          esac
          version="${TAG#v}"

          # The digest GitHub reports for the published asset — not a
          # re-download and re-hash. It is the same field the `Upload SHA256
          # checksums` step joins its sidecars on, so the cask and the sidecars
          # cannot disagree about what the published bytes are.
          #
          # `--jq` is not used here: `gh` takes at most one positional arg and
          # rejects the `--arg` that carries the asset name into the filter, so
          # the JSON goes to a real `jq` instead of being spliced into a filter
          # string.
          asset="Table.View_${version}_aarch64.dmg"
          digest="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets |
            jq -r --arg n "$asset" '[.assets[] | select(.name == $n) | .digest] | if length == 1 then .[0] else "" end')"
          if [ -z "$digest" ]; then
            echo "::error::no single $TAG asset is named $asset with a digest. The cask would keep the previous checksum while claiming the new version, which fails every user's install with a SHA256 mismatch." >&2
            exit 1
          fi
          case "$digest" in
            sha256:*) sha="${digest#sha256:}" ;;
            *)
              echo "::error::$asset reports digest '$digest', which is not sha256:<hex>." >&2
              exit 1
              ;;
          esac

          # `--depth 1` is enough to rewrite one file and push one commit, and
          # the tap is small. The credential in the URL is masked in the log by
          # Actions (it is a secret) and the workspace dies with the run.
          git clone --quiet --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap

          # Rewrites the two value lines and re-reads the file to prove they
          # landed. Regression suite: scripts/release/update-homebrew-cask.test.sh
          bash scripts/release/update-homebrew-cask.sh tap/Casks/table-view.rb "$version" "$sha"

          if git -C tap diff --quiet -- Casks/table-view.rb; then
            echo "::notice::$TAP_REPO already carries $version with that checksum — nothing to push"
            exit 0
          fi

          git -C tap -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "table-view $version" -m "$RELEASE_URL" -- Casks/table-view.rb
          git -C tap push origin HEAD:main
          echo "::notice::$TAP_REPO Casks/table-view.rb bumped to $version"
