name: E2E Smoke

# The runtime smoke matrix that used to live here is gone. Every leg of it ran
# through scripts/e2e-smoke-ci.sh — the single entry point that exported the
# per-DBMS endpoint env vars, built the Tauri debug binary, seeded fixtures and
# invoked wdio — and that script (plus scripts/e2e-smoke-routing-decisions.ts,
# scripts/e2e-pre-smoke-release-gate.ts and scripts/e2e-smoke-flake-summary.sh,
# which it called) was removed with the rest of the script tree. Without an
# entry point the 24-spec matrix and its Postgres/MySQL/MariaDB/MSSQL/Oracle/
# Redis/Valkey/Elasticsearch/OpenSearch service containers had nothing to run.
#
# What remains is the reporting shell. `Runtime Happy Path` and `Detect Change
# Scope` are required contexts in the `pr_to_main` ruleset — live GitHub state,
# not repo state — so deleting this workflow would leave both permanently
# "expected" and block every merge. These jobs keep the names reporting and
# nothing else: THERE IS NO RUNTIME E2E COVERAGE BEHIND THEM. The e2e sources
# themselves (e2e/, wdio.smoke.conf.ts) are untouched, so restoring the runner
# restores the matrix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report change scope
        run: echo "change-scope classification removed"

  e2e-smoke-required:
    name: Runtime Happy Path
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report runtime smoke status
        run: echo "runtime e2e smoke removed; no runtime coverage behind this context"
