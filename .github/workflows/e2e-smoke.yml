name: E2E Smoke

# There is no runtime E2E smoke. This workflow is a reporting shell: it exists
# because `Runtime Happy Path` is a required context in the `pr_to_main` ruleset
# (live GitHub state), and a name that stops reporting stays "expected" and
# blocks every merge. THIS JOB VERIFIES NOTHING.
#
# Since 2026-07-31 this is the ruleset's ONLY name-only context: the other two
# stubs are gone (one dropped from ruleset and workflow, one turned into a real
# check in ci.yml). Keep one workflow per required name, or the ruleset cannot
# tell which run satisfied it. memory/runbook/pr-merge-gates/memory.md carries
# the live list.
#
# The e2e sources (`e2e/`, `wdio.smoke.conf.ts`) still work by hand — see
# README 「E2E Smoke」. Wiring them back means writing a runner, then registering
# the contexts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-smoke-required:
    name: Runtime Happy Path
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report runtime smoke status
        run: echo "runtime e2e smoke removed; no runtime coverage behind this context"
