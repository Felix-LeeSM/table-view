[alias]
# Shortcuts for the DB tier-2 integration tests. testcontainers brings the
# docker container up lazily on the first call and cleans it up through Drop
# when the process exits. When env vars such as PG/Mongo `*_HOST`/`*_PORT` are
# set, an external instance is reused instead (fast iteration while developing).
#
# Examples:
#   cargo pg-test                 — PG integration tests (query/schema/value-search/fixture)
#   cargo mongo-test              — Mongo integration tests
#   cargo mysql-test              — MySQL integration tests
#   cargo mssql-test              — SQL Server integration tests (#1642)
#   cargo oracle-test             — Oracle integration tests (#1674; amd64-only image)
#   cargo db-test                 — PG + Mongo + MySQL + MSSQL + Oracle, all of them
#   PGHOST=... cargo pg-test      — reuse an external PG
#   MSSQL_HOST=... cargo mssql-test — reuse an external SQL Server
#   ORACLE_HOST=... cargo oracle-test — reuse an external Oracle (no image for arm)
pg-test = "test --test query_integration --test schema_integration --test value_search_integration --test fixture_loading"
mongo-test = "test --test mongo_integration"
mysql-test = "test --test mysql_integration"
mssql-test = "test --test mssql_integration"
oracle-test = "test --test oracle_integration"
db-test = "test --test query_integration --test schema_integration --test value_search_integration --test fixture_loading --test mongo_integration --test mysql_integration --test mssql_integration --test oracle_integration"
