# #1368 — `unwrap_used` is a crate-level warn (src/lib.rs), promoted to a hard
# error by the `-D warnings` CI clippy gate. Test code legitimately uses
# `.unwrap()` for terse assertions, so allow it inside `#[cfg(test)]` /
# `#[test]` contexts. clippy reads this file from CARGO_MANIFEST_DIR, so the
# copy in `src-tauri/clippy.toml` does NOT reach this crate.
allow-unwrap-in-tests = true
