[package]
name = "table-view-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
# Internal crate of the desktop app — never published to crates.io. It carries the
# same marker as `table-view`, so cargo deny skips the license check through
# `[licenses.private]`.
publish = false
description = "Headless core for table-view: DB adapters, wire models, and local storage. No Tauri dependency, so a CLI/daemon surface can link it without a webview."

# #2161 — this crate is a member of the Cargo workspace rooted at
# `src-tauri/Cargo.toml`. It joins through the path dependency in
# `[dependencies]` even without being listed in `members`, but that list is also
# CI's scope, so it is written there as well.
#
# The property this crate holds is unchanged: built on its own it pulls in no
# Tauri transitive dep (`cargo tree -p table-view-core -i tauri` → exit 101).
# ADR 0061's `tvw` CLI track requires that property, and a workspace does not
# change the dependency graph, so it still holds.
#
# The price #1769 used to pay — a separate `Cargo.lock` for this crate — is gone.
# Back then the first standalone resolve raised duckdb 1.10503.1 → 1.10505.0 and
# broke the match in `db/duckdb/value.rs` with E0004, so the two locks had to be
# reconciled by hand. Now `src-tauri/Cargo.lock` is the only lock, so that failure
# mode cannot arise.

[lib]
name = "table_view_core"

[features]
default = []
# Means "this build is a test build of `table-view`". `cfg(test)` cannot express
# that state — `table-view` links this crate as an ordinary dependency, so this
# crate's `cfg(test)` is false in that crate's test build.
#
# Two things it turns on:
#   - The stub adapter bundle in `db::testing` (`crate::db::testing::Stub*`).
#   - #2184 — `storage::data_dir_override` honouring `TABLE_VIEW_TEST_DATA_DIR`.
#     `debug_assertions` is a profile signal, so it left a release test build with
#     no isolation mechanism. This feature fills that gap.
#
# `src-tauri/Cargo.toml` turns it on only from `[dev-dependencies]`, so it stays
# out of release builds. **If this feature enters the normal build graph, a
# shipped binary can be pointed at another data directory through the
# environment, and #1454 reopens.**
#
# CI measures that, not this comment — the `Test-only data-dir override stays out
# of the release graph` step in `.github/workflows/ci.yml` reads **the feature set
# cargo actually turned on for the release graph** with
# `cargo tree -i table-view-core --edges normal --format '{f}'` and fails when
# `testing` is in it. Changing the `default` line below to `default = ["testing"]`
# and dropping the workspace to resolver 1 — which unifies dev-dep features into
# the normal build — are both caught by that one line, because it reads the
# resolve result rather than the manifest text.
testing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "migrate", "json", "uuid", "chrono", "bigdecimal"] }
mongodb = "3"
bson = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
bip39 = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
dirs = "6"
# F.5 — query_history `sql_redacted` regex masking in storage/sql_redact.rs
# (quoted/numeric literal → `?`). The same crate is already locked in as a
# transitive of `mongodb`, so it adds no build cost.
regex = "1"
# #1107 — db/search_http.rs percent-encodes an ES/OpenSearch index name as a URL
# path segment so a validated index cannot escape its segment. Already locked at
# 2.3.2 through the reqwest/url transitive, so promoting it to a direct dep costs
# no build time.
percent-encoding = "2"
# Redis/Valkey KV adapter. `tokio-rustls-comp` gives async command support on the
# existing Tokio runtime and `rediss://` TLS.
redis = { version = "0.32", features = ["tokio-rustls-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "native-tls", "tokio", "chrono", "bigdecimal"] }
# Q22 keyring file-key migration (2026-05-16). The cross-platform abstraction
# lives in `storage::crypto::KeyringBackend`, and tests use an in-memory backend,
# so a test build never links the real OS keyring. Per-platform features are
# turned on only in the target blocks below, so a single-OS build does not pull in
# the other two native backends.
keyring = { version = "3", default-features = false }
# AST allowlist for db/raw_where.rs. For the re-audit rule that applies on a bump,
# see memory/engineering/conventions/rust/memory.md.
sqlparser = "0.62.0"
duckdb = { version = "1.10503.1", features = ["bundled", "json", "parquet"] }
oracle-rs = "0.1.7"
# #2154 — `db/oracle.rs` installs a process-level rustls `CryptoProvider`.
# oracle-rs builds its TLS config with `rustls::ClientConfig::builder()`, which
# reads that process default, and this workspace compiles rustls with *both*
# provider features on (redis pulls `aws-lc-rs`, hyper-rustls pulls `ring`), so
# rustls cannot pick one on its own and `builder()` panics. Already locked at
# 0.23.x through those crates, so this direct dep adds no build cost.
# `default-features = false` on purpose: rustls 0.23's default set also carries
# `prefer-post-quantum`, which is *not* enabled in this graph today, and turning
# it on here would change the key exchange every other rustls user negotiates.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"

# `[profile.dev] debug = 0` lives in the workspace root (`src-tauri/Cargo.toml`).
# Cargo warns about and ignores a member's `[profile.*]`, so putting it here would
# be a lie — the single root profile covers every member (#2161).
