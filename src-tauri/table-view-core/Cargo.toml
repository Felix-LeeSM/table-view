[package]
name = "table-view-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
# 데스크톱 앱의 내부 crate — crates.io 에 publish 되지 않음. `table-view` 와 같은
# 표식이라 cargo deny 가 `[licenses.private]` 로 license 검사를 건너뛴다.
publish = false
description = "Headless core for table-view: DB adapters, wire models, and local storage. No Tauri dependency, so a CLI/daemon surface can link it without a webview."

# #2161 — `src-tauri/Cargo.toml` 을 root 로 하는 Cargo workspace 의 member 다.
# `[dependencies]` 의 path dependency 라 `members` 에 안 적어도 들어오지만, 그
# 목록이 곧 CI 의 범위라 거기에도 적혀 있다.
#
# 이 crate 가 지키는 성질은 그대로다: 단독으로 빌드하면 Tauri transitive dep 이
# 하나도 안 딸려온다 (`cargo tree -p table-view-core -i tauri` → exit 101).
# ADR 0061 의 `tvw` CLI 트랙이 요구하는 성질이고, workspace 는 의존 그래프를 안
# 바꾸므로 유지된다.
#
# #1769 이 치르던 대가 — 이 crate 의 별도 `Cargo.lock` — 는 없어졌다. 그때는 첫
# 단독 resolve 가 duckdb 를 1.10503.1 → 1.10505.0 으로 올려 `db/duckdb/value.rs`
# 의 match 를 E0004 로 깨뜨렸고, 두 lock 을 손으로 맞춰야 했다. 이제 lock 은
# `src-tauri/Cargo.lock` 하나라 그 유형이 성립하지 않는다.

[lib]
name = "table_view_core"

[features]
default = []
# "이 빌드는 `table-view` 의 테스트 빌드다" 를 뜻한다. `cfg(test)` 로는 못 세는
# 상태다 — `table-view` 가 이 crate 를 평범한 의존성으로 링크하므로 그쪽 테스트
# 빌드에서 이 crate 의 `cfg(test)` 는 false 다.
#
# 켜지는 것 둘:
#   - `db::testing` 의 stub adapter 묶음 (`crate::db::testing::Stub*`).
#   - #2184 — `storage::data_dir_override` 의 `TABLE_VIEW_TEST_DATA_DIR` 인식.
#     `debug_assertions` 는 profile 신호라 release 테스트 빌드에 격리 수단을 안
#     남겼다. 이 feature 가 그 자리를 메운다.
#
# `src-tauri/Cargo.toml` 이 `[dev-dependencies]` 쪽에서만 켜므로 릴리스 빌드에는
# 안 들어간다. **이 feature 가 일반 빌드 그래프에 들어가면 배포 바이너리를 env 로
# 다른 데이터 디렉토리에 돌릴 수 있게 되어 #1454 가 다시 열린다.**
#
# 그 사실은 주석이 아니라 CI 가 잰다 — `.github/workflows/ci.yml` 의
# `Test-only data-dir override stays out of the release graph` 스텝이
# `cargo tree -i table-view-core --edges normal --format '{f}'` 로 **cargo 가
# 릴리스 그래프에 실제로 켜 준 feature 집합**을 읽고, 거기 `testing` 이 있으면
# 실패한다. 아래 `default` 줄을 `default = ["testing"]` 로 바꾸는 것도, workspace
# 를 resolver 1 로 떨어뜨려 dev-dep feature 를 일반 빌드로 unify 시키는 것도 같은
# 한 줄이 잡는다 — manifest 텍스트가 아니라 resolve 결과를 읽기 때문이다.
testing = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "migrate", "json", "uuid", "chrono", "bigdecimal"] }
mongodb = "3"
bson = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
bip39 = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
dirs = "6"
# Sprint 371 (Phase 5 F.5) — storage/sql_redact.rs 의 query_history
# `sql_redacted` regex masking (quoted/numeric literal → `?`). 같은 crate 가
# `mongodb` 의 transitive 로 이미 잠겨 있어 build cost 추가 0.
regex = "1"
# #1107 — db/search_http.rs 가 ES/OpenSearch index 이름을 URL path segment 로
# percent-encode 해서 검증된 index 가 segment 를 탈출하지 못하게 한다. reqwest/url
# transitive 로 이미 2.3.2 에 잠겨 있어 direct dep 으로 올려도 build cost 0.
percent-encoding = "2"
# Sprint 466 — Redis/Valkey KV adapter. `tokio-rustls-comp` 가 기존 Tokio
# 런타임 위의 async command 지원과 `rediss://` TLS 를 준다.
redis = { version = "0.32", features = ["tokio-rustls-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "native-tls", "tokio", "chrono", "bigdecimal"] }
# Sprint 356 (2026-05-16) — Q22 keyring file-key migration.
# Cross-platform 추상화는 `storage::crypto::KeyringBackend` 에 있고, 테스트가
# in-memory backend 를 쓰므로 테스트 시점에 실제 OS keyring 과 링크하지 않는다.
# 플랫폼별 feature 는 아래 target 블록에서만 켜서 단일 OS 빌드가 나머지 둘의
# native backend 를 안 끌게 한다.
keyring = { version = "3", default-features = false }
# db/raw_where.rs 의 AST allowlist. 범프 시 재감사 규칙은
# memory/engineering/conventions/rust/memory.md 참조.
sqlparser = "0.62.0"
duckdb = { version = "1.10503.1", features = ["bundled", "json", "parquet"] }
oracle-rs = "0.1.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"

# `[profile.dev] debug = 0` 은 workspace root(`src-tauri/Cargo.toml`)가 든다.
# member 의 `[profile.*]` 는 cargo 가 경고를 내고 무시하므로 여기 두면 거짓말이
# 된다 — root 하나가 member 전부에 걸린다 (#2161).
