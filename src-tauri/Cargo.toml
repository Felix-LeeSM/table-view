# #2161 — every Rust crate in this repository sits in one Cargo workspace.
# This manifest is the root and the lock is `src-tauri/Cargo.lock`.
# `table-view-core` / `sql-parser-core` are path dependencies under
# `[dependencies]` below, so they would be members without being listed, but
# nothing depends on `mongosh-parser-core` or `tvw` — those two join only by
# being listed here, so all four are listed. This list is what lets CI run
# `cargo test --workspace --lib` / `cargo fmt --all` / `cargo clippy
# --workspace` instead of naming each crate one by one.
# `tvw` is the CLI of #1770 (ADR 0061). It links `table-view-core` rather than
# the app, and without an entry here that crate falls outside fmt, clippy, and
# `--workspace --lib`.
[workspace]
members = ["table-view-core", "sql-parser-core", "mongosh-parser-core", "tvw"]
# The root manifest is a package, so the resolver already resolves to 2 from
# `edition = "2021"` below. It is spelled out anyway because a refactor that
# turns this manifest into a virtual one (moving the app package into a
# subdirectory, for example) drops the default back to 1, and resolver 1
# unifies dev-dependency features into the normal build graph — which means a
# release binary with `table-view-core`'s `testing` turned on, and that is
# #1454. What this line actually prevents is measured by the `Test-only
# data-dir override stays out of the release graph` step in
# `.github/workflows/ci.yml`.
resolver = "2"

# The app's release profile is the cargo default — `panic` in particular is
# left alone. The panic log path in `src/diagnostics.rs` assumes unwind
# (#1564). The size profile for the two wasm crates is given below through
# `[profile.release.package.*]`: cargo ignores a member's `[profile.*]` in a
# workspace, so the root carries it instead.
[profile.release.package.sql-parser-core]
opt-level = "z"
codegen-units = 1
strip = true

[profile.release.package.mongosh-parser-core]
opt-level = "z"
codegen-units = 1
strip = true

[package]
name = "table-view"
version = "0.7.1"
edition = "2021"
rust-version = "1.91.0"
# Desktop app — not published to crates.io. The marker is what lets cargo deny
# skip the license check for our own crates under its `[licenses.private]`
# rule.
publish = false

[lib]
name = "table_view_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
tauri = { version = "2", features = ["test"] }
# #1769 — the command tests use `crate::db::testing::Stub*`. The dev-dep
# itself resolves and is recorded in Cargo.lock, but the `testing` feature
# does not ride into `cargo build`, because resolver v2 does not unify dev-dep
# features into the normal build graph. To reproduce:
# `cargo tree -i table-view-core --edges normal --format '{f}'` prints only
# `default`, and `testing` appears only with `--edges dev`. The
# `[workspace] resolver = "2"` above is the premise for that property, and a
# CI step measures it.
table-view-core = { path = "table-view-core", version = "0.1.0", features = ["testing"] }
# For the DB tier-2 integration tests. The test process manages the docker
# container lifecycle itself; when `PGHOST`/`PGPORT`/`PGUSER`/`PGPASSWORD`/
# `PGDATABASE` are all set it reuses an external PG instead (fast iteration —
# see the module doc of `tests/common/mod.rs`). Where no docker daemon exists
# (a CI sandbox, say) it fails immediately, so it runs only in the CI
# `Integration Tests (Docker)` job, which has docker.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mongo", "mysql", "mariadb", "mssql_server", "oracle", "redis"] }

[dependencies]
# #1769 — the DB adapter / wire model / local storage body. Built alone with
# `-p table-view-core` it pulls zero Tauri transitive deps (the precondition
# for ADR 0061's `tvw` CLI). `lib.rs` re-exports `db` / `error` / `models` at
# the crate root. Becoming a workspace member does not change the coverage
# denominator — a report covers the sources of the **selected packages**, and
# the coverage job runs without `--workspace`, so it picks the root package
# alone (measured in #2161). Adding `--workspace` to that job would pull the
# core sources into the denominator and put the `--fail-under-*` numbers on a
# different population.
table-view-core = { path = "table-view-core", version = "0.1.0" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# #1400 — auto-update: updater fetches/verifies (minisign) the signed bundle,
# process plugin relaunches the app after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "migrate", "json", "uuid", "chrono", "bigdecimal"] }
mongodb = "3"
bson = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# #1564 — file log sink. Packaged builds (macOS `.app` from Finder → stdout
# /dev/null; Windows `windows_subsystem = "windows"` → detached console) drop
# every `tracing` line; this crate's non-blocking, daily-rotating appender
# tees them to a local file (ADR 0036 — logs stay on the user's machine, no
# remote telemetry). Small crate; transitively pulls `time`,
# `crossbeam-channel`, and `symlink 0.1.0` (all MIT/Apache, cargo-deny ok).
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
csv = "1"
# Redis/Valkey KV adapter. `tokio-rustls-comp` gives async command support on
# the existing Tokio runtime and `rediss://` TLS.
redis = { version = "0.32", features = ["tokio-rustls-comp"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "native-tls", "tokio", "chrono", "bigdecimal"] }
tauri-plugin-single-instance = "2"
# Pure-Rust SQL parser. The crate lives under `sql-parser-core/` and the same
# `.rs` sources compile to native (this dep) and to WASM (frontend lazy-load
# via wasm-pack). `cargo build --target wasm32-unknown-unknown` of the
# sub-crate pulls in no Tauri transitive deps: the dependency edge runs this
# way only.
sql-parser-core = { path = "sql-parser-core", version = "0.1.0" }
duckdb = { version = "1.10503.1", features = ["bundled", "json", "parquet"] }
oracle-rs = "0.1.7"

[profile.dev]
# llvm-cov source-based coverage needs no DWARF (coverage mapping is its own
# section). This stops instrumented builds on the CI runner and in local
# worktrees from exhausting the disk through duckdb static linking ×
# debuginfo. Panic locations survive without debuginfo. For a debugger
# session, override it once: CARGO_PROFILE_DEV_DEBUG=2 cargo build
debug = 0
