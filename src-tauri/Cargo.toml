[package]
name = "table-view"
version = "0.6.0"
edition = "2021"
rust-version = "1.91.0"
# 데스크톱 앱 — crates.io 에 publish 되지 않음. 표식이 있어야 cargo deny 가
# `[licenses.private]` 규칙으로 우리 crate 의 license 검사를 건너뛴다.
publish = false

[lib]
name = "table_view_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
tauri = { version = "2", features = ["test"] }
# #1769 — command 테스트가 `crate::db::testing::Stub*` 를 쓴다. dev-dep 자체는
# 해소돼 Cargo.lock 에 들어가지만 `testing` feature 는 `cargo build` 에 안 실린다
# — resolver v2 가 dev-dep 의 feature 를 일반 빌드 그래프로 unify 하지 않기
# 때문이다 (`cargo tree --manifest-path src-tauri/Cargo.toml -e features -i
# table-view-core --edges normal` → `feature "default"` 만, `--edges dev` 에서만
# `feature "testing"`). 이 crate 는 `[workspace]` 가 없어 resolver 2 가 package
# `edition = "2021"` 로 암묵 적용된다 — 나중에 virtual workspace manifest 를
# 추가하면 `resolver = "2"` 를 명시해라. virtual manifest 는 member 의 edition 과
# 무관하게 resolver 1 이 기본이라, 빠뜨리면 `db/testing.rs` 가 release 빌드에
# 조용히 들어온다.
table-view-core = { path = "table-view-core", version = "0.1.0", features = ["testing"] }
# Sprint 237 P5+ (2026-05-08) — DB tier 2 통합 테스트용. cargo test --test
# pg_integration 호출 시 process 안에서 docker container lifecycle 을
# 자체 관리. PG_TEST_URL env 가 셋팅돼 있으면 외부 PG 재사용 (빠른
# iteration). docker daemon 이 없는 환경 (CI sandbox 등) 에서는 즉시
# 실패하므로, docker 가 있는 CI `Integration Tests (Docker)` job 에서만 돈다.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "mongo", "mysql", "mssql_server", "oracle", "redis"] }

[dependencies]
# #1769 — DB adapter / wire model / 로컬 저장소 본체. `sql-parser-core` 와 같은
# path dependency (workspace member 아님) 라서 llvm-cov profile 이 섞이지 않고,
# core 를 단독 빌드할 때 Tauri transitive dep 이 0 이다 (ADR 0061 의 `tvw` CLI
# 선행 조건). `lib.rs` 가 `db` / `error` / `models` 를 crate root 로 re-export
# 한다.
table-view-core = { path = "table-view-core", version = "0.1.0" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# #1400 — auto-update: updater fetches/verifies (minisign) the signed bundle,
# process plugin relaunches the app after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "migrate", "json", "uuid", "chrono", "bigdecimal"] }
mongodb = "3"
bson = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# #1564 — file log sink. Packaged builds (macOS `.app` from Finder → stdout
# /dev/null; Windows `windows_subsystem = "windows"` → detached console) drop
# every `tracing` line; this crate's non-blocking, daily-rotating appender
# tees them to a local file (ADR 0036 — logs stay on the user's machine, no
# remote telemetry). Small crate; transitively pulls `time`,
# `crossbeam-channel`, and `symlink 0.1.0` (all MIT/Apache, cargo-deny ok).
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
csv = "1"
# Sprint 466 — Redis/Valkey KV adapter. `tokio-rustls-comp` gives async
# command support on the existing Tokio runtime and `rediss://` TLS.
redis = { version = "0.32", features = ["tokio-rustls-comp"] }
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "native-tls", "tokio", "chrono", "bigdecimal"] }
tauri-plugin-single-instance = "2"
# Sprint 385 (2026-05-17) — pure-Rust SQL parser. The crate lives under
# `sql-parser-core/` as a path dependency (NOT a Cargo workspace member)
# so `cargo llvm-cov --lib` for `table-view` stays isolated from the new
# crate's coverage profile and so `cargo build --target
# wasm32-unknown-unknown` of the sub-crate doesn't pull in any Tauri
# transitive deps. The same `.rs` sources compile to native (this dep)
# and to WASM (frontend lazy-load via wasm-pack).
sql-parser-core = { path = "sql-parser-core", version = "0.1.0" }
duckdb = { version = "1.10503.1", features = ["bundled", "json", "parquet"] }
oracle-rs = "0.1.7"

[profile.dev]
# llvm-cov source-based coverage 는 DWARF 가 필요 없다 (coverage mapping 은 별도
# 섹션). CI 러너/로컬 worktree 의 계측 빌드가 duckdb 정적 링크 × debuginfo 로
# 디스크를 고갈시키던 것을 막는다. panic 위치는 debuginfo 없이도 유지된다.
# 디버거 세션이 필요하면 일회성 오버라이드: CARGO_PROFILE_DEV_DEBUG=2 cargo build
debug = 0
