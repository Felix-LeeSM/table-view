# cargo-deny configuration — license / vulnerability / banned-crate gate.
#
# Policy summary:
#   - licenses: only well-known OSS licenses are allowed. Ambiguous or
#     source-available licenses are denied until they are added explicitly.
#   - advisories: known CVEs are denied. unmaintained / unsound are warnings
#     (after a manual review, either add them to `ignore` or replace the
#     dependency).
#   - bans: duplicate dependencies are a warning (minor-version drift is
#     unavoidable in the Tauri/Tokio ecosystem). Dangerous crates go on the
#     deny list.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
# Policy: every `ignore` entry is (a) a transitive dependency we cannot swap out
# ourselves and (b) waiting for an upstream fix to reach us. State a review date
# next to every entry — re-review the whole list once 6 months have passed (an
# advisory that has been resolved is removed immediately).
# When a direct dependency goes unmaintained, do not ignore it; migrate to a
# replacement crate.
ignore = [
  # ── Tauri / Wry ecosystem: GTK3 bindings (Linux backend) ─────────────
  # Path: tauri-runtime-wry → wry → webkit2gtk-sys → gdkx11-sys → gtk-sys etc.
  # Unresolvable until tauri 2.x migrates to gtk-rs 4.x. macOS is our primary
  # target, so a large share of this is dead code on the real paths.
  "RUSTSEC-2024-0411", # gtk crate
  "RUSTSEC-2024-0412", # gtk-sys
  "RUSTSEC-2024-0413", # gdk
  "RUSTSEC-2024-0414", # gdk-sys
  "RUSTSEC-2024-0415", # gdk-pixbuf
  "RUSTSEC-2024-0416", # gdkx11 / gdkx11-sys
  "RUSTSEC-2024-0417", # gio
  "RUSTSEC-2024-0418", # glib
  "RUSTSEC-2024-0419", # gobject-sys
  "RUSTSEC-2024-0420", # pango / pango-sys
  # ── Tauri ecosystem: open-i18n/rust-unic ─────────────────────────────
  # Path: tauri-utils → urlpattern → unic-ucd-ident → unic-* family.
  # Resolves by itself once tauri moves its url-pattern impl elsewhere.
  "RUSTSEC-2024-0370", # proc-macro-error (the macro half of urlpattern → unic) — bundled with some entries
  "RUSTSEC-2025-0075", # unic-char-property
  "RUSTSEC-2025-0080", # unic-char-range
  "RUSTSEC-2025-0081", # unic-common
  "RUSTSEC-2025-0098", # unic-ucd-ident / unic-ucd-version
  "RUSTSEC-2025-0100", # further unic crates
  # ── one-off unmaintained ─────────────────────────────────────────────
  "RUSTSEC-2025-0057", # fxhash (transitive, many paths)
  # ── Oracle driver: rustls-pemfile unmaintained ───────────────────────
  # Path: oracle-rs 0.1.7 → rustls-pemfile 2.2.0. #518 wires up only the
  # service-name lifecycle/test path and does not expose the wallet/TLS/PEM
  # input paths. Remove as soon as oracle-rs migrates to the rustls-pki-types
  # PemObject API, or a replacement pure-Rust Oracle driver becomes usable.
  # Reviewed: 2026-06-06.
  "RUSTSEC-2025-0134", # rustls-pemfile (transitive through oracle-rs)
  # ── MongoDB driver: two hickory-dns CVEs ─────────────────────────────
  # Path: mongodb 3.6.0 → hickory-resolver 0.25.2 → hickory-proto 0.25.2.
  # mongodb pins hickory-proto to ~0.25.2, so `cargo update` cannot resolve it.
  # Real impact: our desktop app uses hickory as a *DNS client* — both CVEs
  # trigger while processing a malicious DNS response. They only fire when the
  # user enters an arbitrary MongoDB host and goes through a malicious
  # resolver. The dependency security follow-up is tracked in
  # docs/contributor-guide/testing-and-quality.md. Resolved the moment we adopt
  # mongodb 4.x or hickory-proto 0.25.3+.
  "RUSTSEC-2026-0118", # hickory-proto NSEC3 unbounded loop
  "RUSTSEC-2026-0119", # hickory-proto O(n²) name compression
  # ── sqlx-mysql: rsa 0.9 timing sidechannel (Marvin Attack) ───────────
  # Path: sqlx-mysql 0.8.6 → rsa 0.9.10. The MySQL 8.0+ default auth plugins
  # (caching_sha2_password / sha256_password) use the rsa crate when they
  # encrypt the password with the server public key. No patch until upstream
  # stabilizes a constant-time RSA implementation (tracking RustCrypto/RSA#626).
  # Real impact: the advisory itself says "local use on a non-compromised
  # computer is fine" — the Marvin Attack presupposes a scenario where the
  # attacker can measure the victim's RSA timing over the network (a TLS
  # server, for example). Table View is a desktop app — the user connects to
  # their own MySQL server directly, and an attacker has no channel to measure
  # that user's connection timing. The auth plugin can be bypassed with
  # mysql_native_password (which does not use RSA), but the user's environment
  # decides that. The dependency security follow-up is tracked in
  # docs/contributor-guide/testing-and-quality.md. Resolved the moment we adopt
  # sqlx 0.9+ or rsa 0.10+. Surfaced once the sqlx mysql feature was enabled.
  "RUSTSEC-2023-0071",
  # ── plist → quick-xml: two XML parsing DoS issues ────────────────────
  # Path: tauri 2.10.3 / tauri-codegen 2.5.5 → plist 1.8.0 → quick-xml 0.38.4.
  # Both advisories are fixed in quick-xml >=0.41.0, but the newest plist
  # (1.9.0) pins quick-xml to ^0.39.2, so `cargo update` cannot reach 0.41 —
  # a transitive that stays unresolved until plist ships a release adopting
  # quick-xml 0.41+.
  # Real impact: plist is the Apple property-list (Info.plist) parser, used
  # only when tauri reads *our own app bundle's trusted metadata*. Both DoS
  # vectors (quadratic time on duplicate start-tag attributes / unbounded
  # NsReader namespace allocation) require parsing attacker-controlled XML, and
  # our usage path never hands arbitrary network or user XML to plist. The
  # dependency security follow-up is tracked in
  # docs/contributor-guide/testing-and-quality.md.
  # Remove as soon as plist releases a version depending on quick-xml >=0.41.0.
  # Reviewed: 2026-07-02.
  "RUSTSEC-2026-0194", # quick-xml quadratic time on duplicate start-tag attributes
  "RUSTSEC-2026-0195", # quick-xml unbounded NsReader namespace allocation
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "OpenSSL",
  # webpki-roots — the Mozilla CA bundle. Community Data License Agreement
  # Permissive 2.0 — an OSS-friendly license that applies only to the data
  # (the CA list). Reviewed 2026-05-07.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Our crates set `publish = false`, so we have no obligation to declare a
# license of our own. It must be split into a sub-table for cargo-deny 0.19.x
# to recognize it (the inline `private = {…}` form misses the schema in some
# versions).
[licenses.private]
ignore = true

[[licenses.exceptions]]
# ring does not express its multiple licenses as an OR; it ships its own
# LICENSE file instead. The effective terms are confirmed to be ISC + MIT +
# OpenSSL combined, so it is handled as an exception.
name = "ring"
allow = ["LicenseRef-ring"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
